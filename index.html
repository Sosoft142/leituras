        +'<li>Na lista de caixinhas, marque <b>somente</b> <code>gist</code>. Nenhuma outra.</li>'
        +'<li>Role até o fim → <b>Generate token</b> → copie. Começa com <code>ghp_</code> e o GitHub só mostra uma vez.</li></ol>'
        +'<p class="hint2"><b>Precisa ser o clássico.</b> Os <i>Fine-grained tokens</i>, que aparecem primeiro na tela, ainda não oferecem permissão de Gists — lá a opção simplesmente não existe. Marcando só <code>gist</code> no clássico, o token fica igualmente restrito: alcança seus gists e nada mais.</p>'
        +'<p class="hint2">O token fica guardado só neste aparelho e nunca entra no Exportar. Se perder o celular, dá para revogá-lo no GitHub com um clique.</p></details>';
    }

    var html='<div class="modal" role="dialog" aria-modal="true">'
      +'<div class="modal-head"><h2>Salvar e sincronizar</h2><button class="icon-btn" data-x aria-label="Fechar">'+svg(IC.x)+'</button></div>'
      +'<h3 class="fsec">Entre aparelhos</h3>'+sync
      +'<h3 class="fsec">Neste computador</h3>'
      +estado+corpo
      +(acoes?'<div class="fileacts">'+acoes+'</div>':'')
      +'<h3 class="fsec">Cópia de segurança</h3>'
      +'<p class="hint2">Baixa ou carrega um arquivo com tudo: matérias, textos, faltas e progresso. Serve para guardar por fora ou levar para um aparelho que não usa a sincronização.</p>'
      +'<div class="fileacts"><button class="btn-ghost" data-exportar>'+svg(IC.down,15)+' Exportar</button>'
      +'<button class="btn-ghost" data-importar>'+svg(IC.up,15)+' Importar</button></div>'
      +drive
      +'<div class="modal-foot"><button class="btn-ghost" data-cancel>Fechar</button></div></div>';

    var ov=buildOverlay(html);
    ov.querySelector('[data-x]').addEventListener('click', closeModal);
    ov.querySelector('[data-cancel]').addEventListener('click', closeModal);
    var b;
    if((b=ov.querySelector('[data-novo]')))        b.addEventListener('click', function(){ conectarArquivo(true); });
    if((b=ov.querySelector('[data-abrir]')))       b.addEventListener('click', function(){ conectarArquivo(false); });
    if((b=ov.querySelector('[data-reconectar]')))  b.addEventListener('click', reconectarArquivo);
    if((b=ov.querySelector('[data-desconectar]'))) b.addEventListener('click', desconectarArquivo);
    if((b=ov.querySelector('[data-syncon]')))   b.addEventListener('click', function(){
      syncConectar(document.getElementById('sync_tok').value); });
    if((b=ov.querySelector('[data-syncpush]'))) b.addEventListener('click', function(){
      syncEnviar(false).then(function(){ if(syncState==='on'){ closeModal(); renderAll(); } else abrirModalArquivo(); }); });
    if((b=ov.querySelector('[data-syncforce]')))b.addEventListener('click', function(){
      syncEnviar(true).then(function(){ closeModal(); renderAll(); }); });
    if((b=ov.querySelector('[data-syncpull]'))) b.addEventListener('click', function(){ syncBaixar(); });
    if((b=ov.querySelector('[data-exportar]'))) b.addEventListener('click', doExport);
    if((b=ov.querySelector('[data-importar]'))) b.addEventListener('click', function(){ importFile.click(); });
    if((b=ov.querySelector('[data-syncoff]')))  b.addEventListener('click', function(){
      if(!confirm('Desconectar a sincronização deste aparelho?\n\nO progresso continua salvo aqui e a cópia na nuvem não é apagada.')) return;
      esqueceSync(); closeModal(); renderAll(); });
    var tok=ov.querySelector('#sync_tok'); if(tok) tok.focus();
  }

  // ---- export / import ----
  function stamp(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function downloadJson(data, filename){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }
  function doExport(){ downloadJson({subjects:subjects, texts:texts, tcc:tcc}, 'tracker-leituras-'+stamp()+'.json'); }
  function doImport(file){
    var reader=new FileReader();
    reader.onload=function(){
      var obj;
      try{ obj=JSON.parse(reader.result); }catch(e){ alert('Não consegui ler esse arquivo. Verifique se é um JSON exportado por este tracker.'); return; }
      if(!obj || !Array.isArray(obj.subjects)){ alert('Esse JSON não parece ser um backup deste tracker (não encontrei matérias).'); return; }
      if(!confirm('Importar vai SUBSTITUIR as matérias e textos atuais.\n\nUm backup do estado atual será baixado antes. Continuar?')) return;
      downloadJson({subjects:subjects, texts:texts, tcc:tcc}, 'backup-antes-de-importar-'+stamp()+'.json');
      subjects=obj.subjects.map(normSubject);
      texts=Array.isArray(obj.texts)?obj.texts.map(normText):[];
      tcc=normTcc(obj.tcc);
      currentSubjectId=null; ajustarMateriaAtual();
      query=''; fTag=''; searchInput.value=''; clearX.style.display='none';
      persist(); renderAll();
      alert('Importado: '+subjects.length+' matéria(s) e '+texts.length+' texto(s).');
    };
    reader.readAsText(file);
  }

  function clearSearch(){
    if(searchTimer){ clearTimeout(searchTimer); searchTimer=null; }
    query=''; fTag=''; searchInput.value=''; clearX.style.display='none';
    renderTagbar(); renderTable();
  }

  // ---- mount ----
  function mount(){
    app=document.getElementById('app');
    app.innerHTML=
      '<header class="hero" id="hero"></header>'
      +'<div class="viewbar">'
        +'<div class="vswitch" id="vswitch">'
          +'<button data-v="subject">'+svg(IC.list,15)+' Por matéria</button>'
          +'<button data-v="week">'+svg(IC.cal,15)+' Cronograma</button>'
          +'<span class="vsep" aria-hidden="true"></span>'
          +'<button class="tcc-tab" data-v="tcc">'+svg(IC.book,15)+' TCC</button>'
        +'</div>'
        +'<div class="viewbar-right">'
          +'<button class="btn-ghost sm" id="fileBtn"></button>'
          +'<button class="icon-toggle" id="prefsBtn" title="Menu e preferências">'+svg(IC.menu,17)+'</button>'
          +'<button class="icon-toggle" id="theme" title="Modo escuro"></button></div>'
      +'</div>'
      +'<div class="subjects" id="subjects"></div>'
      +'<section class="panel" id="panel"></section>'
      +'<div class="toolbar" id="toolbar">'
        +'<div class="search" id="searchWrap"><span style="display:inline-flex;opacity:.5">'+svg(IC.search,15)+'</span>'
          +'<input id="q" placeholder="Buscar texto nesta matéria…">'
          +'<button class="clear-x" id="clearx" aria-label="Limpar busca" style="display:none">'+svg(IC.x,13)+'</button></div>'
        +'<div class="sort-mob" id="sortMob">Ordenar: <select class="tool-select" id="sortSel">'
          +'<option value="number">Nº</option><option value="date">Data da aula</option>'
          +'<option value="author">Autor</option><option value="status">Status</option>'
          +'<option value="priority">Prioridade</option></select></div>'
        +'<div class="tool-right">'
          +'<button class="btn-wine" id="add">'+svg(IC.plus,15)+' Adicionar texto</button>'
        +'</div>'
        +'<input type="file" id="impfile" accept="application/json,.json" style="display:none">'
      +'</div>'
      +'<div class="tagbar" id="tagbar"></div>'
      +'<div class="table-wrap" id="tw"></div>'
      +'<div class="week" id="week"></div>'
      +'<div class="tcc" id="tcc"></div>'
      +'<footer class="foot" id="foot"></footer>';

    hero=document.getElementById('hero');
    subjectsEl=document.getElementById('subjects');
    panel=document.getElementById('panel');
    toolbar=document.getElementById('toolbar');
    tagbar=document.getElementById('tagbar');
    tw=document.getElementById('tw');
    weekEl=document.getElementById('week');
    tccEl=document.getElementById('tcc');
    tccEl.addEventListener('click', tccActions);
    foot=document.getElementById('foot');
    searchInput=document.getElementById('q');
    clearX=document.getElementById('clearx');
    importFile=document.getElementById('impfile');
    themeBtn=document.getElementById('theme');

    searchInput.addEventListener('input', function(){
      query=searchInput.value; clearX.style.display=query?'':'none';
      if(searchTimer) clearTimeout(searchTimer);
      searchTimer=setTimeout(function(){ searchTimer=null; renderTable(); }, 120);
    });
    clearX.addEventListener('click', clearSearch);
    document.getElementById('sortSel').addEventListener('change', function(){
      sortKey=this.value; sortDir='asc'; renderTable();
    });
    themeBtn.addEventListener('click', function(){ dark=!dark; saveUI(); renderAll(); });
    document.getElementById('vswitch').addEventListener('click', function(e){
      var b=e.target.closest('[data-v]'); if(!b) return;
      view=b.getAttribute('data-v'); openMenuId=null;
      saveUI(); applyView(); renderMain();
    });
    document.getElementById('add').addEventListener('click', function(){
      if(!currentSubjectId){ alert('Crie uma matéria primeiro.'); return; }
      openTextModal(null);
    });
    document.getElementById('fileBtn').addEventListener('click', abrirModalArquivo);
    document.getElementById('prefsBtn').addEventListener('click', abrirPreferencias);
    importFile.addEventListener('change', function(){ if(importFile.files && importFile.files[0]){ doImport(importFile.files[0]); importFile.value=''; } });

    subjectsEl.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act');
      if(act==='pick'){ currentSubjectId=el.getAttribute('data-id'); query=''; fTag=''; faltasAberta=false;
        searchInput.value=''; clearX.style.display='none'; openMenuId=null; renderAll(); return; }
      if(act==='addsubj'){ openSubjectModal(null); return; }
    });

    panel.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
      if(act==='editsubj'){ var s=findSubject(id); if(s) openSubjectModal(s); return; }
      if(act==='togglefaltas'){ faltasAberta=!faltasAberta; renderPanel(); return; }
      if(act==='addfalta'){
        var card=el.closest('.subj-head');
        var inp=card?card.querySelector('[data-fdate]'):null;
        addFalta(el.getAttribute('data-sid'), inp?inp.value:'');
        return;
      }
      if(act==='delfalta'){ delFalta(el.getAttribute('data-sid'), el.getAttribute('data-d')); return; }
    });

    tagbar.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act');
      if(act==='tagf'){ var t=el.getAttribute('data-t'); fTag=(fTag===t?'':t); renderTagbar(); renderTable(); return; }
      if(act==='tagclear'){ fTag=''; renderTagbar(); renderTable(); return; }
    });

    /* Troca o número por um campo ali mesmo, sem re-renderizar a lista —
       re-renderizar mataria o foco no meio da digitação. */
    function abrirEdicaoPaginas(btn){
      var id=btn.getAttribute('data-id');
      var t=findText(id); if(!t) return;
      var inp=document.createElement('input');
      inp.type='number'; inp.className='pedit-inp'; inp.min='0';
      inp.setAttribute('inputmode','numeric');
      inp.setAttribute('aria-label','Páginas lidas');
      if(t.pages!=null) inp.max=String(t.pages);
      inp.value = (t.pagesRead!=null ? t.pagesRead : '');
      btn.parentNode.replaceChild(inp, btn);
      inp.focus(); inp.select();
      var fechado=false;
      function encerrar(salvar){
        if(fechado) return; fechado=true;
        if(salvar){
          var txt=inp.value.trim();
          var v = txt==='' ? null : Math.max(0, Math.floor(Number(txt)||0));
          if(v!=null && t.pages!=null && v>t.pages) v=t.pages;
          if(v!==t.pagesRead){ t.pagesRead=v; persist(); }
        }
        renderAll();
      }
      inp.addEventListener('keydown', function(ev){
        ev.stopPropagation();
        if(ev.key==='Enter'){ ev.preventDefault(); encerrar(true); }
        else if(ev.key==='Escape'){ ev.preventDefault(); encerrar(false); }
      });
      inp.addEventListener('blur', function(){ encerrar(true); });
      inp.addEventListener('click', function(ev){ ev.stopPropagation(); });
    }

    function rowActions(e){
      if(e.target.closest('[data-stop]')) return;
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
      if(act==='sort'){ var k=el.getAttribute('data-k');
        if(sortKey===k) sortDir=(sortDir==='asc'?'desc':'asc'); else { sortKey=k; sortDir='asc'; }
        openMenuId=null; renderTable(); return; }
      if(act==='clearsearch'){ clearSearch(); return; }
      if(act==='pedit'){ e.stopPropagation(); e.preventDefault(); abrirEdicaoPaginas(el); return; }
      if(act==='tagf'){ e.stopPropagation(); var g=el.getAttribute('data-t'); fTag=(fTag===g?'':g); renderTagbar(); renderTable(); return; }
      if(act==='edit'){ var t=findText(id); if(t) openTextModal(t); return; }
      if(act==='pill'){ e.stopPropagation(); openMenuId=(openMenuId===id?null:id); renderMain(); return; }
      if(act==='setstatus'){ e.stopPropagation(); var b=findText(id); if(b) b.status=el.getAttribute('data-s');
        openMenuId=null; persist(); renderAll(); return; }
    }
    tw.addEventListener('click', rowActions);
    weekEl.addEventListener('click', rowActions);

    document.addEventListener('click', function(){
      var changed=false;
      if(openMenuId!==null){ openMenuId=null; changed=true; }
      if(changed) renderMain();
    });

    document.addEventListener('keydown', function(e){
      if(e.key==='Escape'){
        if(modalOpen()){ closeModal(); return; }
        var changed=false;
        if(openMenuId!==null){ openMenuId=null; changed=true; }
        if(changed) renderMain();
        return;
      }
      if(modalOpen()) return;
      var tag=(e.target && e.target.tagName)||'';
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
      if(e.ctrlKey||e.metaKey||e.altKey) return;
      if(e.key==='n'){ e.preventDefault();
        if(view==='tcc'){ openEtapaModal(null); return; }
        if(currentSubjectId) openTextModal(null); return; }
      // "t" abre e fecha o TCC — ele fica fora do rodízio da tecla "s"
      if(e.key==='t'){ e.preventDefault();
        view = (view==='tcc') ? 'subject' : 'tcc';
        saveUI(); applyView(); renderMain(); return; }
      if(e.key==='/'){ e.preventDefault(); if(view!=='subject'){ view='subject'; applyView(); renderMain(); } searchInput.focus(); return; }
      if(e.key==='s'){ e.preventDefault();
        var ordem=['subject','week'];
        var i=ordem.indexOf(view);
        view = (i<0) ? 'subject' : ordem[(i+1)%ordem.length];
        saveUI(); applyView(); renderMain(); return; }
    });

    window.addEventListener('scroll', function(){
      if(openMenuId!==null){ openMenuId=null; renderStatusMenu(); }
    }, true);
    window.addEventListener('resize', function(){
      if(openMenuId!==null){ openMenuId=null; renderStatusMenu(); }
      if(isNarrow()!==narrow){ narrow=isNarrow(); applyView(); renderMain(); }
    });

    // Só preferências de tela: os dados já são salvos a cada alteração.
    window.addEventListener('beforeunload', function(){ try{ saveUI(); }catch(e){} });

    narrow=isNarrow();
    load();
    migrarFaltas();
    loadUI();
    migrarTcc();
    loadSync();
    retomarArquivo();
    ajustarMateriaAtual();
    searchInput.value=query;
    renderAll();
    syncAoAbrir();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
</body>
</html>
