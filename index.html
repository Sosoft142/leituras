  /* Cor e id acabam DENTRO de atributos HTML (style, data-id, title). Um
     backup ou um gist de terceiro pode trazer qualquer coisa nesses campos, e
     isso virava injeção de HTML sem nenhum clique. Aqui eles são reduzidos ao
     formato esperado; o que não bate é descartado. */
  // "toString" e "constructor" existem em qualquer objeto: sem esta checagem,
  // um status inválido passava e ia parar corrompido na nuvem
  function temValor(mapa, k){ return typeof k==='string' && Object.prototype.hasOwnProperty.call(mapa, k); }
  function corSegura(c, padrao){
    c=String(c==null?'':c).trim();
    if(/^#[0-9a-f]{3}$/i.test(c) || /^#[0-9a-f]{6}$/i.test(c)) return c;
    return padrao===undefined?'':padrao;
  }
  function idSeguro(v, prefixo){
    v=String(v==null?'':v).trim();
    return /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : uid(prefixo);
  }

  /* Código de horário do SIGAA/UnB: dígitos = dias (2=segunda … 7=sábado),
     letra = turno (M manhã, T tarde, N noite), dígitos finais = slots de 1 h.
     Ex.: "35M12" = terça e quinta, manhã, 1º e 2º horários (8h–9h50).
     Aceita vários blocos separados por espaço: "35M12 6T34". */
  var DIA_CURTO=['','dom','seg','ter','qua','qui','sex','sáb'];
  var TURNO_INI={M:8, T:14, N:19};        // hora do 1º slot de cada turno
  // último slot que ainda termina dentro do dia (o slot n começa às INI+n-1)
  var TURNO_MAX={M:6, T:6, N:4};

  function parseHorario(cod){
    cod=String(cod||'').toUpperCase().replace(/\s+/g,' ').trim();
    if(!cod) return null;
    var blocos=cod.split(' ').filter(Boolean), out=[];
    for(var i=0;i<blocos.length;i++){
      var m=/^([2-7]+)([MTN])([1-6]+)$/.exec(blocos[i]);
      if(!m) return null;                       // um bloco errado invalida o código todo
      var turno=m[2];
      var slots=m[3].split('').map(Number).filter(function(v,j,arr){ return arr.indexOf(v)===j; })
        .sort(function(x,y){ return x-y; });
      // slot além do fim do turno faria a aula "terminar" às 24h ou depois
      if(slots[slots.length-1] > TURNO_MAX[turno]) return null;
      var dias=m[1].split('').map(Number).filter(function(v,j,arr){ return arr.indexOf(v)===j; })
        .sort(function(x,y){ return x-y; });
      out.push({dias:dias, turno:turno, slots:slots, txt:blocos[i]});
    }
    return out.length?out:null;
  }
  // os slots são de hora em hora a partir do início do turno; a aula termina
  // 50 min depois do começo do último slot
  function horaDoSlot(turno, slot){
    var h=TURNO_INI[turno]; if(h==null) return null;
    var min=(slot-1)*60;
    return {h:h+Math.floor(min/60), m:min%60};
  }
  function hhmm(o){ return o.h+'h'+(o.m?pad2(o.m):''); }
  function listaPt(a){
    if(a.length<=1) return a.join('');
    return a.slice(0,-1).join(', ')+' e '+a[a.length-1];
  }
  /* Slots não seguidos ("M13") são duas aulas com um buraco no meio; mostrar
     "8h–10h50" fingia três horas seguidas de aula. */
  function faixaHoraria(bloco){
    var grupos=[], atual=null;
    bloco.slots.forEach(function(sl){
      if(atual && sl===atual[atual.length-1]+1) atual.push(sl);
      else { atual=[sl]; grupos.push(atual); }
    });
    return grupos.map(function(g){
      var ini=horaDoSlot(bloco.turno, g[0]);
      var fim=horaDoSlot(bloco.turno, g[g.length-1]);
      if(!ini||!fim) return '';
      var fimReal={h:fim.h, m:fim.m+50}; if(fimReal.m>=60){ fimReal.h++; fimReal.m-=60; }
      return hhmm(ini)+'–'+hhmm(fimReal);
    }).filter(Boolean).join(' e ');
  }
  // todos os dias da semana (0=dom … 6=sáb) em que a matéria tem aula
  function diasDeAula(sb){
    var bl=parseHorario(sb && sb.schedule); if(!bl) return [];
    var set={};
    bl.forEach(function(b){ b.dias.forEach(function(d){ set[d-1]=1; }); });
    return Object.keys(set).map(Number).sort(function(a,b){return a-b;});
  }
  function horarioTexto(sb){
    var bl=parseHorario(sb && sb.schedule); if(!bl) return '';
    return bl.map(function(b){
      // no código, 2=segunda … 7=sábado — que é justamente o índice em DIA_CURTO
      var ds=b.dias.map(function(d){ return DIA_CURTO[d]; });
      return listaPt(ds)+' · '+faixaHoraria(b);
    }).join(' | ');
  }
  /* Próxima data de aula DEPOIS de uma data dada. Sem horário cadastrado, cai
     no comportamento antigo: uma semana à frente. */
  function proximaAula(sb, isoBase){
    var dias=diasDeAula(sb);
    var d=parseISO(isoBase); if(!d) return '';
    if(!dias.length){ d.setDate(d.getDate()+7); return diaLocal(d); }
    for(var i=1;i<=14;i++){
      var t=new Date(d.getTime()); t.setDate(t.getDate()+i);
      if(dias.indexOf(t.getDay())>=0) return diaLocal(t);
    }
    d.setDate(d.getDate()+7); return diaLocal(d);
  }

  // ---- normalize ----
  function normSubject(s){
    var o=Object.assign({id:"",name:"",professor:"",color:PALETTE[0],absenceLimit:7,absences:[],
      driveLink:"",tcc:false,schedule:"",place:""}, s);
    o.schedule=String(o.schedule||'').toUpperCase().replace(/\s+/g,' ').trim().slice(0,40);
    o.place=String(o.place||'').trim().slice(0,60);
    o.tcc=!!o.tcc;
    o.id=idSeguro(o.id,'subj');
    o.color=corSegura(o.color, PALETTE[0]);
    var lim=num(o.absenceLimit);
    o.absenceLimit = (lim==null||lim<0) ? 7 : Math.min(lim, 30);
    if(!Array.isArray(o.absences)) o.absences=[];
    o.absences=o.absences.filter(function(d,i,arr){
      return /^\d{4}-\d{2}-\d{2}$/.test(d) && arr.indexOf(d)===i;   // sem datas repetidas
    });
    return o;
  }
  function normText(t){
    var o=Object.assign({id:"",subjectId:"",number:null,name:"",originalTitle:"",author:"",classDate:"",
      link:"",color:"",status:"nao_lido",notes:"",pages:null,pagesRead:null,priority:"normal",tags:[],
      kind:"texto",avalType:"prova"}, t);
    o.kind = (o.kind==='aval') ? 'aval' : 'texto';
    if(!temValor(AVAL_TIPO, o.avalType)) o.avalType='prova';
    o.id=idSeguro(o.id,'t');
    o.color=corSegura(o.color);           // vazio = herda a cor da matéria
    if(!isoOk(o.classDate)) o.classDate='';
    if(!temValor(STATUS, o.status)) o.status='nao_lido';
    if(!temValor(PRIO, o.priority)) o.priority='normal';
    o.number=num(o.number);
    if(o.number!=null && o.number<0) o.number=null;      // o "min=0" do formulário não era respeitado
    o.pages=num(o.pages);
    if(o.pages!=null && o.pages<0) o.pages=null;
    o.pagesRead=num(o.pagesRead);
    if(o.pagesRead!=null && o.pagesRead<0) o.pagesRead=null;
    if(o.pagesRead!=null && o.pages!=null && o.pagesRead>o.pages) o.pagesRead=o.pages;
    if(!Array.isArray(o.tags)) o.tags = o.tags? String(o.tags).split(',').map(function(x){return x.trim();}).filter(Boolean) : [];
    delete o.ref;   // gerador de referências removido
    return o;
  }
  function normEtapa(e){
    var o=Object.assign({id:"",name:"",start:"",end:"",status:"todo",notes:""}, e);
    o.id=idSeguro(o.id,'et');
    if(!temValor(ETAPA, o.status)) o.status='todo';
    if(!isoOk(o.start)) o.start='';
    if(!isoOk(o.end)) o.end='';
    if(o.start && o.end && o.end < o.start) o.end=o.start;
    return o;
  }
  function normOrient(o0){
    var o=Object.assign({id:"",date:"",combinado:"",proximos:""}, o0);
    o.id=idSeguro(o.id,'or');
    if(!isoOk(o.date)) o.date='';
    return o;
  }
  /* Um backup ou um aparelho de versão anterior à aba TCC manda o payload SEM a
     chave "tcc". Isso não é "TCC vazio", é "não sei nada sobre TCC" — zerar as
     etapas e orientações nesse caso destrói dados. */
  /* Se um id de matéria precisar ser saneado, os textos que apontam para ele
     têm de ser levados junto — senão viram órfãos invisíveis. */
  function normalizarTudo(rawSubjects, rawTexts){
    var mapa={};
    var subs=(rawSubjects||[]).map(function(x){
      var antes=(x&&x.id)!=null?String(x.id):'';
      var s2=normSubject(x);
      if(antes && antes!==s2.id) mapa[antes]=s2.id;
      return s2;
    });
    var txs=(Array.isArray(rawTexts)?rawTexts:[]).map(function(x){
      var t2=normText(x);
      if(mapa[t2.subjectId]) t2.subjectId=mapa[t2.subjectId];
      return t2;
    });
    return {subjects:subs, texts:txs};
  }
  function tccRecebido(obj, atual){
    if(obj && Object.prototype.hasOwnProperty.call(obj,'tcc')) return normTcc(obj.tcc);
    return atual || normTcc(null);
  }
  /* Mesma ideia para os textos: uma chave "texts" ausente significa "não sei",
     não "apague tudo". Um gist editado à mão ou uma gravação parcial não podem
     zerar as leituras de todos os aparelhos. */
  function temChave(obj, k){ return !!obj && Object.prototype.hasOwnProperty.call(obj,k) && Array.isArray(obj[k]); }
  function normTcc(t){
    var o=Object.assign({titulo:"",orientadora:"",prazo:"",prazoLabel:"Entrega final",driveLink:"",
      etapas:[], orientacoes:[]}, t||{});
    if(!isoOk(o.prazo)) o.prazo='';
    if(!o.prazoLabel) o.prazoLabel='Entrega final';
    o.etapas = Array.isArray(o.etapas) ? o.etapas.map(normEtapa) : [];
    o.orientacoes = Array.isArray(o.orientacoes) ? o.orientacoes.map(normOrient) : [];
    return o;
  }
  function isoOk(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d||''); }

  // ---- sincronização entre aparelhos (GitHub Gist) ----
  var SYNC_KEY='tracker-leituras:sync';
  var GIST_FILE='tracker-leituras.json';
  var GIST_DESC='Tracker de Leituras UnB — progresso sincronizado';
  var syncToken='', gistId='', lastSyncedAt='', dataUpdatedAt='';
  var syncState='off';   // off | on | conflito | erro
  var syncMsg='', syncBusy=false, syncTimer=null, syncAt='';

  function nowISO(){ return new Date().toISOString(); }
  function loadSync(){
    try{ var o=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}');
      syncToken=o.token||''; gistId=o.gist||''; lastSyncedAt=o.at||''; syncAt=o.when||'';
    }catch(e){}
    if(syncToken && gistId) syncState='on';
  }
  function saveSync(){
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify({token:syncToken, gist:gistId, at:lastSyncedAt, when:syncAt})); }catch(e){}
  }
  /* O token fica só aqui, nunca entra no Exportar nem no arquivo local. */
  function esqueceSync(){
    syncToken=''; gistId=''; lastSyncedAt=''; syncAt=''; syncState='off'; syncMsg='';
    try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
  }

  function gh(caminho, opts){
    opts=opts||{};
    var req={ method:opts.method||'GET',
      headers:{ 'Authorization':'Bearer '+syncToken,
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28' } };
    if(opts.body){ req.body=JSON.stringify(opts.body); req.headers['Content-Type']='application/json'; }
    return fetch('https://api.github.com'+caminho, req).then(function(r){
      if(r.status===401) throw new Error('Token inválido ou expirado. Gere um novo no GitHub.');
      if(r.status===403) throw new Error('O GitHub recusou (limite de uso ou permissão faltando).');
      if(r.status===404) throw new Error('O arquivo de sincronização não foi encontrado na sua conta.');
      if(!r.ok) throw new Error('O GitHub respondeu com erro '+r.status+'.');
      return r.json();
    });
  }
  function conteudoDoGist(g){
    var f=g && g.files && g.files[GIST_FILE];
    if(!f || typeof f.content!=='string') return null;
    try{ return JSON.parse(f.content); }catch(e){ return null; }
  }
  function corpoDoGist(){
    var files={}; files[GIST_FILE]={content:JSON.stringify(payload(),null,2)};
    return {description:GIST_DESC, files:files};
  }
  function aplicarRemoto(obj){
    if(!obj || !Array.isArray(obj.subjects) || !obj.subjects.length) return false;
    if(!temChave(obj,'texts')) return false;      // incompleto: não dá para confiar
    var d=normalizarTudo(obj.subjects, obj.texts);
    subjects=d.subjects; texts=d.texts;
    tcc=tccRecebido(obj, tcc);
    dataUpdatedAt=obj.updatedAt||nowISO();
    ajustarMateriaAtual();
    persist({noStamp:true, noSync:true});
    lastSyncedAt=dataUpdatedAt; syncAt=nowISO(); saveSync();
    return true;
  }
  function syncFalhou(e){
    syncState='erro'; syncMsg=(e&&e.message)||'Falha ao sincronizar.'; syncBusy=false;
    renderFileBtn();
  }

  function syncEnviar(forcar){
    if(syncState==='off' || !syncToken || !gistId) return Promise.resolve();
    syncBusy=true; renderFileBtn();
    return gh('/gists/'+gistId).then(function(g){
      var remoto=conteudoDoGist(g);
      var remotoAt=(remoto&&remoto.updatedAt)||'';
      /* Sem lastSyncedAt não dá para saber se a nuvem mudou — antes isso
         DESLIGAVA a checagem e o envio sobrescrevia tudo em silêncio. Agora o
         desconhecido também vira conflito. */
      var desconhecido = !lastSyncedAt && remotoAt && remotoAt!==dataUpdatedAt;
      if(!forcar && remotoAt && (desconhecido || (lastSyncedAt && remotoAt!==lastSyncedAt))){
        syncState='conflito'; syncBusy=false;
        syncMsg='Este aparelho e a nuvem têm versões diferentes.';
        renderFileBtn();
        return;
      }
      return gh('/gists/'+gistId, {method:'PATCH', body:corpoDoGist()}).then(function(){
        lastSyncedAt=dataUpdatedAt; syncAt=nowISO(); saveSync();
        syncState='on'; syncMsg=''; syncBusy=false; renderFileBtn();
      });
    }).catch(syncFalhou);
  }
  function syncBaixar(){
    if(!syncToken || !gistId) return Promise.resolve();
    syncBusy=true; renderFileBtn();
    return gh('/gists/'+gistId).then(function(g){
      var remoto=conteudoDoGist(g);
      if(!remoto) throw new Error('A cópia na nuvem está vazia ou ilegível.');
      if(!aplicarRemoto(remoto)) throw new Error('A cópia na nuvem está incompleta (faltam matérias ou textos) — nada foi baixado.');
      migrarTcc();
      syncState='on'; syncMsg=''; syncBusy=false;
      closeModal(); renderAll();
    }).catch(syncFalhou);
  }
  function agendarSync(){
    if(syncState!=='on') return;
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer=setTimeout(function(){ syncTimer=null; syncEnviar(false); }, 2500);
  }
  /* Ao abrir: se só a nuvem mudou, baixa; se só este aparelho mudou, envia;
     se os dois mudaram, para e pergunta. */
  function syncAoAbrir(){
    if(syncState!=='on' || !syncToken || !gistId) return;
    syncBusy=true; renderFileBtn();
    gh('/gists/'+gistId).then(function(g){
      var remoto=conteudoDoGist(g);
      var remotoAt=(remoto&&remoto.updatedAt)||'';
      var localMudou = dataUpdatedAt && lastSyncedAt && dataUpdatedAt!==lastSyncedAt;
      var remotoMudou = remotoAt && lastSyncedAt && remotoAt!==lastSyncedAt;
      syncBusy=false;
      if(remotoMudou && localMudou){
        syncState='conflito'; syncMsg='Este aparelho e a nuvem têm versões diferentes.';
        renderFileBtn(); return;
      }
      if(remotoMudou || (!lastSyncedAt && remotoAt)){
        if(aplicarRemoto(remoto)){ renderAll(); return; }
      }
      if(localMudou) return syncEnviar(false);
      syncAt=nowISO(); saveSync(); renderFileBtn();
    }).catch(syncFalhou);
  }
  /* Conectar: acha um gist já existente desta conta (assim o 2º aparelho
     entra sozinho) ou cria um novo com o que há neste aparelho. */
  function syncConectar(token){
    token=(token||'').trim();
    if(!token){ alert('Cole o token do GitHub para conectar.'); return; }
    syncToken=token; syncBusy=true; syncMsg=''; renderFileBtn();
    return gh('/gists?per_page=100').then(function(lista){
      var achado=null;
      (lista||[]).forEach(function(g){
        if(!achado && g.files && g.files[GIST_FILE]) achado=g;
      });
      if(achado){
        gistId=achado.id; lastSyncedAt=''; syncState='on'; saveSync();
        return syncBaixar().then(function(){
          if(syncState==='on') toastSync('Conectado. Progresso baixado da nuvem.');
        });
      }
      return gh('/gists', {method:'POST', body:Object.assign({public:false}, corpoDoGist())})
        .then(function(g){
          gistId=g.id; lastSyncedAt=dataUpdatedAt; syncAt=nowISO();
          syncState='on'; syncBusy=false; saveSync();
          closeModal(); renderAll();
          toastSync('Conectado. Este aparelho virou a cópia principal.');
        });
    }).catch(function(e){
      syncToken=''; gistId=''; syncState='off';
      syncBusy=false; syncMsg=(e&&e.message)||'Falha ao conectar.';
      renderFileBtn();
      alert('Não consegui conectar: '+syncMsg);
    });
  }
  function toastSync(msg){ syncMsg=msg; renderFileBtn(); }

  // ---- arquivo único (File System Access API) ----
  var fileHandle=null, fileName='', fileState='off';  // off | on | precisa | nao_suportado
  var fileTimer=null, fileErr='';
  var IDB_DB='tracker-leituras', IDB_STORE='fs', IDB_KEY='handle';

  function fsSuportado(){ return typeof window.showSaveFilePicker==='function'; }
  function idbOpen(){
    return new Promise(function(res,rej){
      if(!window.indexedDB) return rej(new Error('sem indexedDB'));
      var r=indexedDB.open(IDB_DB,1);
      r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_STORE); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ rej(r.error); };
    });
  }
  function idbPut(v){
    return idbOpen().then(function(db){ return new Promise(function(res,rej){
      var tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(v, IDB_KEY);
      tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); };
    }); });
  }
  function idbGet(){
    return idbOpen().then(function(db){ return new Promise(function(res,rej){
      var tx=db.transaction(IDB_STORE,'readonly');
      var q=tx.objectStore(IDB_STORE).get(IDB_KEY);
      q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); };
    }); });
  }
  function payload(){ return {versao:1, updatedAt:dataUpdatedAt, subjects:subjects, texts:texts, tcc:tcc}; }

  function escreverArquivo(){
    if(fileState!=='on' || !fileHandle) return Promise.resolve();
    return fileHandle.createWritable().then(function(w){
      return w.write(JSON.stringify(payload(),null,2)).then(function(){ return w.close(); });
    }).then(function(){
      if(fileErr){ fileErr=''; renderFileBtn(); }
    }).catch(function(e){
      fileErr=e && e.message ? e.message : 'falha ao gravar';
      fileState='precisa'; renderFileBtn();
    });
  }
  function agendarEscrita(){
    if(fileState!=='on') return;
    if(fileTimer) clearTimeout(fileTimer);
    fileTimer=setTimeout(function(){ fileTimer=null; escreverArquivo(); }, 400);
  }
  /* Fechar a aba com uma escrita ainda na fila deixava o arquivo e a nuvem
     atrás do navegador. Ao esconder a página, descarrega o que estiver pendente. */
  function descarregarPendencias(){
    if(fileTimer){ clearTimeout(fileTimer); fileTimer=null; try{ escreverArquivo(); }catch(e){} }
    if(syncTimer){ clearTimeout(syncTimer); syncTimer=null; try{ syncEnviar(false); }catch(e){} }
  }
  function assinatura(o){
    try{ return JSON.stringify({s:o.subjects, t:o.texts, c:o.tcc}); }catch(e){ return ''; }
  }
  function conteudoDiferente(obj){
    return assinatura(obj) !== assinatura({subjects:subjects, texts:texts, tcc:tcc});
  }
  /* Trocar os dados vivos pelos de um arquivo é destrutivo: se o arquivo for
     mais antigo, some trabalho. Perguntar, mostrando as duas datas. */
  function confirmarTroca(obj){
    var doArquivo=obj.updatedAt||'', daMemoria=dataUpdatedAt||'';
    var quando=function(x){
      if(!x) return 'data desconhecida';
      var d=new Date(x); if(isNaN(d.getTime())) return 'data desconhecida';
      return fmtDate(diaLocal(d))+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
    };
    var maisVelho = doArquivo && daMemoria && doArquivo < daMemoria;
    return confirm('Substituir o que está aberto agora pelo conteúdo do arquivo?\n\n'
      +'Neste aparelho: '+quando(daMemoria)+'\n'
      +'No arquivo: '+quando(doArquivo)
      +(maisVelho?'\n\nATENÇÃO: o arquivo é MAIS ANTIGO. Você perde o que fez desde então.':'')
      +'\n\nEsta ação não pode ser desfeita.');
  }
  function aplicarConteudo(obj){
    if(!obj || !Array.isArray(obj.subjects) || !obj.subjects.length) return false;
    if(!temChave(obj,'texts')) return false;
    var d=normalizarTudo(obj.subjects, obj.texts);
    subjects=d.subjects; texts=d.texts;
    tcc=tccRecebido(obj, tcc);
    ajustarMateriaAtual();
    return true;
  }
  function conectarArquivo(novo){
    if(!fsSuportado()){ abrirModalArquivo(); return; }
    var pedir = novo
      ? window.showSaveFilePicker({ suggestedName:'tracker-leituras.json',
          types:[{description:'Progresso do tracker', accept:{'application/json':['.json']}}] })
      : window.showOpenFilePicker({ multiple:false,
          types:[{description:'Progresso do tracker', accept:{'application/json':['.json']}}] })
          .then(function(a){ return a[0]; });
    return pedir.then(function(h){
      fileHandle=h; fileName=h.name||'arquivo.json'; fileState='on'; fileErr='';
      if(novo) return escreverArquivo();
      return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
        var obj=null; try{ obj=JSON.parse(txt); }catch(e){}
        if(obj && aplicarConteudo(obj)){ persist(); }
        else if(txt && txt.trim()){ alert('Esse arquivo não tem dados do tracker. Vou passar a gravar o progresso atual nele.'); }
        return escreverArquivo();
      });
    }).then(function(){
      return idbPut(fileHandle).catch(function(){});
    }).then(function(){
      closeModal(); renderAll();
    }).catch(function(e){
      if(e && e.name==='AbortError') return;   // a pessoa cancelou o seletor
      alert('Não consegui conectar o arquivo: '+((e&&e.message)||e));
    });
  }
  function desconectarArquivo(){
    fileHandle=null; fileName=''; fileState='off'; fileErr='';
    idbPut(null).catch(function(){});
    closeModal(); renderAll();
  }
  /* Ao abrir, tenta retomar o arquivo já autorizado. O navegador pode exigir
     um clique para reconceder a permissão — daí o estado "precisa". */
  function retomarArquivo(){
    if(!fsSuportado()){ fileState='nao_suportado'; renderFileBtn(); return; }
    idbGet().then(function(h){
      if(!h) return;
      fileHandle=h; fileName=h.name||'arquivo.json';
      if(!h.queryPermission){ fileState='precisa'; renderFileBtn(); return; }
      return h.queryPermission({mode:'readwrite'}).then(function(p){
        if(p!=='granted'){ fileState='precisa'; renderFileBtn(); return; }
        fileState='on';
        return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
          var obj=null; try{ obj=JSON.parse(txt); }catch(e){}
          /* Só reescreve se o arquivo trouxer algo REALMENTE diferente. Antes,
             qualquer abertura recarimbava dataUpdatedAt e inventava conflito
             com a nuvem em todo boot. */
          if(obj && conteudoDiferente(obj) && aplicarConteudo(obj)) persist();
          renderAll();
        });
      });
    }).catch(function(){ /* sem arquivo guardado */ });
  }
  function reconectarArquivo(){
    if(!fileHandle || !fileHandle.requestPermission){ conectarArquivo(true); return; }
    fileHandle.requestPermission({mode:'readwrite'}).then(function(p){
      if(p!=='granted'){ alert('Sem permissão para gravar no arquivo.'); return; }
      fileState='on'; fileErr='';
      return fileHandle.getFile().then(function(f){ return f.text(); }).then(function(txt){
        var obj=null; try{ obj=JSON.parse(txt); }catch(e){}
        if(obj && conteudoDiferente(obj) && confirmarTroca(obj) && aplicarConteudo(obj)) persist();
        return escreverArquivo();
      }).then(function(){ closeModal(); renderAll(); });
    }).catch(function(e){ alert('Não consegui reconectar: '+((e&&e.message)||e)); });
  }

  // ---- persistence ----
  function load(){
    var payload=null;
    try{ var raw=localStorage.getItem(STORAGE_KEY); if(raw) payload=JSON.parse(raw); }catch(e){}
    /* "Zero matérias" não é "nunca usou o app". Só a AUSÊNCIA de payload salvo
       autoriza semear — senão apagar a última matéria fazia o seed ressuscitar
       por cima de tudo, TCC incluído. */
    if(payload && Array.isArray(payload.subjects)){
      var d=normalizarTudo(payload.subjects, payload.texts);
      subjects=d.subjects; texts=d.texts;
      tcc=tccRecebido(payload, null);
      dataUpdatedAt=payload.updatedAt||nowISO();
    } else {
      var seed=seedData();
      var ds=normalizarTudo(seed.subjects, seed.texts);
      subjects=ds.subjects; texts=ds.texts;
      tcc=normTcc(null);
      persist();
    }
  }
  /* "Práticas de Pesquisa 1" deixa de ser uma matéria comum: ela passa a ser a
     aba TCC. A matéria em si continua guardada (com os textos e o link do
     Drive), só some da faixa de matérias e aparece dentro da aba. */
  function migrarTcc(){
    var KEY='tracker-leituras:tcc-v1';
    var jaFez=false;
    try{ jaFez=!!localStorage.getItem(KEY); }catch(e){ return; }
    if(jaFez) return;
    var achou=false;
    subjects.forEach(function(sb){
      if(!sb.tcc && /pr[áa]ticas de pesquisa|^tcc\b|monografia/i.test(sb.name)){
        sb.tcc=true; sb.absenceLimit=0; achou=true;
        if(sb.professor && !tcc.orientadora) tcc.orientadora=sb.professor;
      }
    });
    /* Se nada foi encontrado, a matéria pode ainda estar por chegar da nuvem —
       não queima o selo, para a migração poder rodar depois. */
    if(achou){ try{ localStorage.setItem(KEY,'1'); }catch(e){} ajustarMateriaAtual(); persist(); }
  }
  /* A matéria aberta nunca pode ser a do TCC — ela não aparece na faixa. */
  function ajustarMateriaAtual(){
    var vis=subjectsVis();
    var atual=findSubject(currentSubjectId);
    if(!atual || atual.tcc) currentSubjectId = vis.length ? vis[0].id : null;
  }
  /* Uma vez só: prepara o controle de faltas em quem já usava o app antes
     desta versão. Práticas de Pesquisa 1 (orientação) não tem chamada, então
     entra com o controle desligado. Nenhuma falta é criada. */
  function migrarFaltas(){
    var KEY='tracker-leituras:faltas-v1';
    try{ if(localStorage.getItem(KEY)) return; }catch(e){ return; }
    var mexeu=false;
    subjects.forEach(function(sb){
      // uma migração NUNCA inventa registro: só prepara o controle, zerado
      if(/pr[áa]ticas de pesquisa/i.test(sb.name) && sb.absenceLimit!==0){ sb.absenceLimit=0; mexeu=true; }
    });
    try{ localStorage.setItem(KEY,'1'); }catch(e){}
    if(mexeu) persist();
  }

  /* opts.noStamp: não mexe no carimbo (usado ao receber dados da nuvem)
     opts.noSync : não agenda envio (evita eco quando o dado VEIO da nuvem) */
  function persist(opts){
    opts=opts||{};
    if(!opts.noStamp) dataUpdatedAt=nowISO();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({updatedAt:dataUpdatedAt, subjects:subjects, texts:texts, tcc:tcc}));
      storageWarned=false;
      agendarEscrita();
      if(!opts.noSync) agendarSync();
    }catch(e){
      agendarEscrita();
      if(!opts.noSync) agendarSync();
      if(!storageWarned && fileState!=='on'){ storageWarned=true;
        alert('⚠️ Não consegui salvar neste navegador. O armazenamento pode estar cheio ou bloqueado (janela anônima). Conecte um arquivo em "Arquivo" ou use Exportar antes de fechar.');
      }
    }
  }
  function saveUI(){
    try{ localStorage.setItem(UI_KEY, JSON.stringify({cur:currentSubjectId, sk:sortKey, sd:sortDir, view:view, dark:dark, pace:pace, tag:fTag, grad:gradiente, crono:cronoModo, pend:soPendentes, anel:contornos})); }catch(e){}
  }
  function loadUI(){
    try{
      var raw=localStorage.getItem(UI_KEY); if(!raw) return; var u=JSON.parse(raw); if(!u) return;
      if(u.cur) currentSubjectId=u.cur;
      if(['number','date','author','status','priority'].indexOf(u.sk)>=0) sortKey=u.sk;
      if(u.sd==='desc') sortDir='desc';
      if(u.view==='week') view='week';   // a antiga aba de faltas virou parte do card
      if(u.view==='tcc') view='tcc';
      if(u.crono==='lista'||u.crono==='gantt') cronoModo=u.crono;
      soPendentes=!!u.pend;
      if(typeof u.anel==='boolean') contornos=u.anel;
      dark=!!u.dark;
      if(u.pace) pace=Number(u.pace)||3;
      if(typeof u.tag==='string') fTag=u.tag;
      gradiente=!!u.grad;
    }catch(e){}
  }

  // ---- lookups ----
  function findSubject(id){ for(var i=0;i<subjects.length;i++){ if(subjects[i].id===id) return subjects[i]; } return null; }
  function findText(id){ for(var i=0;i<texts.length;i++){ if(texts[i].id===id) return texts[i]; } return null; }
  function textsOf(subjectId){ return texts.filter(function(t){ return t.subjectId===subjectId; }); }
  // só o que é leitura de verdade conta em "X/Y lidos", tempo estimado e "em dia"
  function leiturasDe(subjectId){ return textsOf(subjectId).filter(function(t){ return !ehAval(t); }); }
  // matérias da faixa: a do TCC vive na aba própria
  function subjectsVis(){ return subjects.filter(function(s){ return !s.tcc; }); }
  function subjectTcc(){ for(var i=0;i<subjects.length;i++){ if(subjects[i].tcc) return subjects[i]; } return null; }
  // cor vazia = herda a cor da matéria
  function textColor(t){
    if(t.color) return t.color;
    var sb=findSubject(t.subjectId);
    return sb?sb.color:'#B7AE9F';
  }
  // avaliação não tem "extensão de leitura", mesmo que traga páginas guardadas
  function estMin(t){ if(ehAval(t)) return null; var p=num(t.pages); if(!p||p<=0) return null; return Math.round(p*pace); }
  /* A marcação de onde parou só faz sentido enquanto a leitura está em curso. */
  function emCurso(t){ return t.status==='lendo' || t.status==='parcial'; }
  function temProgresso(t){ return !ehAval(t) && emCurso(t) && num(t.pagesRead)!=null; }
  function readPct(t){
    var p=num(t.pages), r=num(t.pagesRead);
    if(!p || p<=0 || r==null) return null;
    return Math.max(0, Math.min(100, Math.round(r/p*100)));
  }
  // páginas que ainda faltam, já descontando o que foi lido
  function pagesLeft(t){
    if(ehAval(t)) return null;
    var p=num(t.pages); if(!p||p<=0) return null;
    if(t.status==='lido') return 0;
    var r=num(t.pagesRead);
    if(emCurso(t) && r!=null) return Math.max(0, p-Math.min(r,p));
    return p;
  }
  function estMinRest(t){ var l=pagesLeft(t); return l==null?null:Math.round(l*pace); }
  function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function rgb2hex(a){ return '#'+a.map(function(x){ var v=Math.round(x).toString(16); return v.length<2?'0'+v:v; }).join(''); }
  function lerpCor(c1,c2,t){
    var a=hex2rgb(c1), b=hex2rgb(c2);
    return rgb2hex([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]);
  }
  /* Padrão: cor do status. Com o gradiente ligado, a barra caminha do vermelho
     (nada lido) ao verde (perto do fim), passando pelo âmbar no meio. */
  // tons claros e quentes, para combinar com o papel do resto do app
  var GRAD_INI='#E8796B', GRAD_MEIO='#EFB65C', GRAD_FIM='#86C77E';
  function corDoProgresso(pct){
    return pct<=50 ? lerpCor(GRAD_INI, GRAD_MEIO, pct/50)
                   : lerpCor(GRAD_MEIO, GRAD_FIM, (pct-50)/50);
  }
  function fundoGradiente(pct){
    return 'linear-gradient(90deg,'+GRAD_INI+','+corDoProgresso(pct)+')';
  }
  /* O gradiente marca leitura em andamento. "Lido parcialmente" é uma leitura
     pausada, então segue com a cor sólida do status, sem animação. */
  function usaGradiente(t){ return gradiente && t.status==='lendo'; }
  function progFill(t, pct){
    if(!usaGradiente(t)) return (STATUS[t.status]||STATUS.lendo).dot;
    return fundoGradiente(pct);
  }
  function numEditavel(t, valor){
    return '<button class="pedit" data-act="pedit" data-id="'+t.id+'" title="Clique para mudar quantas páginas já leu">'+valor+'</button>';
  }
  /* Barra some quando não há nada a mostrar: é isso que a mantém discreta. */
  function progHtml(t){
    if(!temProgresso(t)){
      /* Digitar um número acima do total marca o texto como lido — e aí o campo
         de páginas sumia junto com a barra, deixando quem errou a digitação sem
         como corrigir a não ser voltando o status na mão. O número anotado fica
         editável, sem barra, para não poluir a lista de quem já leu. */
      if(t.status==='lido' && !ehAval(t) && num(t.pagesRead)!=null && num(t.pages))
        return '<span class="pnum pnum-fim">'+numEditavel(t,num(t.pagesRead))+'/'+num(t.pages)+'</span>';
      return '';
    }
    var r=num(t.pagesRead), p=num(t.pages), pct=readPct(t);
    var falta=estMinRest(t);
    // em linha própria para não sobrar um "·" solto quando a coluna é estreita
    var faltaTxt = (falta!=null && falta>0) ? '<span class="prest">faltam ≈ '+fmtMin(falta)+'</span>'
                 : (falta===0 ? '<span class="prest">tudo lido</span>' : '');
    if(pct==null) return '<span class="pnum">parou na p. '+numEditavel(t,r)+'</span>'+faltaTxt;
    return '<span class="pbar'+(usaGradiente(t)?' grad':'')+'" role="img" aria-label="'+pct+'% lido"><span style="width:'+pct+'%;background:'+progFill(t,pct)+'"></span></span>'
      +'<span class="pnum">'+numEditavel(t,r)+'/'+p+' · '+pct+'%</span>'+faltaTxt;
  }
  function chipOf(cfg){ return dark?cfg.chipD:cfg.chip; }
  function textOf(cfg){ return dark?cfg.textD:cfg.text; }
  function lineOf(cfg){ return dark?cfg.lineD:cfg.line; }

  /* Referência = os textos da aula de HOJE; se não houver aula hoje, os da
     próxima data futura. Textos passados não lidos não entram no veredito. */
  function subjectStatus(subjectId){
    var t0=todayISO();
    // avaliação não é leitura: fica fora do veredito de "leituras em dia"
    var lista=leiturasDe(subjectId);
    var dated=lista.filter(function(t){ return !!t.classDate; });
    var late=dated.filter(function(t){ return t.classDate<t0 && t.status!=='lido'; }).length;
    var undated=lista.length - dated.length;

    var refDate=null;
    if(dated.some(function(t){ return t.classDate===t0; })) refDate=t0;
    else dated.forEach(function(t){ if(t.classDate>t0 && (refDate===null || t.classDate<refDate)) refDate=t.classDate; });

    if(!refDate) return {kind:'none', late:late, undated:undated, group:[], refDate:null, diff:null, read:0, total:0};

    var group=dated.filter(function(t){ return t.classDate===refDate; })
      .sort(function(a,b){ return (a.number==null?Infinity:a.number)-(b.number==null?Infinity:b.number); });
    var read=0;
    group.forEach(function(t){ if(t.status==='lido') read++; });
    return {kind: read===group.length ? 'ok' : 'todo', late:late, undated:undated, group:group,
            refDate:refDate, diff:dayDiff(refDate,t0), read:read, total:group.length};
  }

  function allTagsOf(subjectId){
    var seen={}, out=[];
    textsOf(subjectId).forEach(function(t){ t.tags.forEach(function(g){ if(!seen[g]){ seen[g]=1; out.push(g); } }); });
    out.sort(function(a,b){ return COLL.compare(a,b); });
    return out;
  }

  function currentTexts(){
    var q=query.trim().toLowerCase();
    var out=textsOf(currentSubjectId).filter(function(t){
      if(soPendentes && t.status==='lido') return false;
      if(fTag && t.tags.indexOf(fTag)<0) return false;
      if(!q) return true;
      return (t.name+' '+(t.originalTitle||'')+' '+(t.author||'')+' '+(t.notes||'')+' '+t.tags.join(' ')).toLowerCase().indexOf(q)>=0;
    });
    var chaveNum = numEfetivo(out);
    var dir=sortDir==='asc'?1:-1;
    out.sort(function(a,b){
      var r=0;
      if(sortKey==='number'){
        // uma única chave por item, calculada antes de ordenar (ver numEfetivo)
        var xa=chaveNum[a.id], xb=chaveNum[b.id];
        r=(xa<xb?-1:xa>xb?1:0)*dir;
      } else if(sortKey==='date'){
        var da=a.classDate||'￿', db=b.classDate||'￿';
        r=(da<db?-1:da>db?1:0)*dir;
      } else if(sortKey==='status'){
        r=(STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status))*dir;
      } else if(sortKey==='priority'){
        r=(PRIO_ORDER.indexOf(a.priority)-PRIO_ORDER.indexOf(b.priority))*dir;
      } else {
        r=COLL.compare(String(a[sortKey]||''),String(b[sortKey]||''))*dir;
      }
      if(r!==0) return r;
      // desempate estável e sem NaN (Infinity - Infinity dava NaN)
      var ka=chaveNum[a.id], kb=chaveNum[b.id];
      if(ka!==kb) return ka<kb?-1:1;
      var ca2=a.classDate||'￿', cb2=b.classDate||'￿';
      if(ca2!==cb2) return ca2<cb2?-1:1;
      return a.id<b.id?-1:a.id>b.id?1:0;
    });
    return out;
  }

  /* Ordenar por "Nº" precisa de UMA chave por item, não de um critério que muda
     conforme o par comparado — isso não formava uma ordem total e o resultado do
     sort passava a depender da ordem em que os itens estavam no array.
     Quem tem número usa o próprio número. Quem não tem (uma avaliação, em geral)
     recebe a posição correspondente à sua data: fica logo depois do último texto
     numerado cuja aula é anterior ou igual à dela. Assim uma prova entre o texto
     2 e o texto 3 recebe 2.5 e cai no lugar certo, sem bagunçar a numeração. */
  function numEfetivo(lista){
    var numerados=lista.filter(function(t){ return t.number!=null; })
      .sort(function(a,b){ return a.number-b.number; });
    var chave={};
    lista.forEach(function(t){
      if(t.number!=null){ chave[t.id]=t.number; return; }
      var ancora=-0.5;                     // sem nenhum numerado antes: vai para o começo
      for(var i=0;i<numerados.length;i++){
        var n=numerados[i];
        if(!n.classDate || !t.classDate) continue;
        if(n.classDate<=t.classDate) ancora=n.number+0.5;
      }
      chave[t.id]=ancora;
    });
    return chave;
  }

  // ---- render: hero ----
  function renderHero(){
    var leituras=texts.filter(function(t){ return !ehAval(t); });
    var totalT=leituras.length, totalRead=0;
    leituras.forEach(function(t){ if(t.status==='lido') totalRead++; });
    var emDia=0, comAula=0;
    var visiveis=subjectsVis();
    visiveis.forEach(function(s){
      var st=subjectStatus(s.id);
      if(st.kind==='none') return;
      comAula++; if(st.kind==='ok') emDia++;
    });
    var diaTxt = comAula ? ' · <b>'+emDia+' de '+comAula+'</b> '+(comAula===1?'matéria em dia':'matérias em dia') : '';
    hero.innerHTML='<div class="hero-line"><span class="hero-ic">'+svg(IC.book,22)+'</span><div>'
      +'<h1>Tracker de Leituras UnB</h1>'
      +'<p class="sub">10º semestre · '+visiveis.length+' '+(visiveis.length===1?'matéria':'matérias')
      +' · '+totalRead+'/'+totalT+' textos lidos'+diaTxt+'</p></div></div>';
  }

  function renderSubjects(){
    var h=subjectsVis().map(function(s){
      var list=leiturasDe(s.id); var read=0; list.forEach(function(t){ if(t.status==='lido') read++; });
      var st=subjectStatus(s.id); var cfg=EMDIA[st.kind];
      var tip = st.kind==='none' ? 'Sem aulas futuras cadastradas'
              : cfg.label+' — próxima aula '+fmtDate(st.refDate)+' ('+relLabel(st.diff)+')';
      var on=s.id===currentSubjectId;
      return '<button class="subtab'+(on?' on':'')+'" data-act="pick" data-id="'+esc(s.id)+'" aria-pressed="'+on+'" title="'+esc(tip)+'"'
        +' style="'+(on?'border-color:'+s.color+';':'')+'">'
        +'<span class="sdot" style="background:'+s.color+'"></span>'
        +'<span class="sname">'+esc(s.name)+'</span>'
        +'<span class="scount">'+read+'/'+list.length+'</span>'
        +'<span class="edot" style="background:'+cfg.dot+'"></span>'
        +'</button>';
    }).join('');
    h+='<button class="add-sub" data-act="addsubj">'+svg(IC.plus,14)+' Matéria</button>';
    subjectsEl.innerHTML=h;
  }

  function emDiaHtml(st){
    var cfg=EMDIA[st.kind];
    var title=cfg.label, desc='';
    if(st.kind==='none'){
      desc = st.undated
        ? 'Nenhum texto com data de aula à frente. '+st.undated+' texto(s) sem data.'
        : 'Cadastre a data das aulas para acompanhar suas leituras.';
    } else {
      var isToday=st.diff===0;
      if(st.kind==='ok') title = isToday ? 'Em dia — leitura de hoje pronta' : 'Em dia';
      else title = isToday ? 'É hoje e falta ler'
                 : (st.read>0 ? 'Leitura pendente — '+st.read+' de '+st.total+' textos lidos' : 'Leitura pendente');
      var names=st.group.map(function(t){
        return '<span class="refname">'+esc(t.name)+'</span> ('+STATUS[t.status].label.toLowerCase()+')';
      }).join(' · ');
      var totMin=0, anyMin=false;
      st.group.forEach(function(t){ if(t.status!=='lido'){ var m=estMinRest(t); if(m!=null){ totMin+=m; anyMin=true; } } });
      desc = (isToday?'Aula de hoje':'Próxima aula')+' <span class="emdia-when">'+fmtDate(st.refDate)+' · '+relLabel(st.diff)+'</span> — '+names
           + (anyMin?' · falta ler ≈ <b>'+fmtMin(totMin)+'</b>':'');
    }
    return '<div class="emdia" style="background:'+chipOf(cfg)+';color:'+textOf(cfg)+';border-color:'+lineOf(cfg)+'">'
      +'<span class="emdia-dot" style="background:'+cfg.dot+'"></span>'
      +'<div class="emdia-main"><div class="emdia-title">'+esc(title)+'</div>'
      +'<div class="emdia-desc">'+desc+'</div></div></div>'
      +(st.late?'<p class="late-note"><b>'+st.late+'</b> texto(s) de aulas passadas ainda não lidos — não contam para o "em dia".</p>':'');
  }

  /* Fechado, o botão já entrega o essencial: as barrinhas e a contagem.
     Aberto, vira o painel de edição — sem virar uma aba separada. */
  function faltasChip(sb){
    if(!sb.absenceLimit) return '';
    var usadas=sb.absences.length, lim=sb.absenceLimit;
    var tom=faltaTom(usadas, lim);
    var slots='<span class="mini-slots" aria-hidden="true">'+Array.apply(null,{length:lim}).map(function(_,i){
      return '<span class="mini-slot"'+(i<usadas?' style="background:'+tom.dot+'"':'')+'></span>';
    }).join('')+'</span>';
    return '<button class="chip-btn'+(faltasAberta?' on':'')+'" data-act="togglefaltas"'
      +' aria-expanded="'+faltasAberta+'" title="Faltas de '+esc(sb.name)+'">'
      +svg(IC.alert,14)+'<span class="chip-lbl">Faltas</span>'+slots
      +'<b style="color:'+(dark?tom.textD:tom.text)+'">'+usadas+'/'+lim+'</b>'
      +'<span class="chip-caret">'+SVG_CARET+'</span></button>';
  }
  function faltasPainel(sb){
    if(!faltasAberta || !sb.absenceLimit) return '';
    var usadas=sb.absences.length, lim=sb.absenceLimit;
    var rest=Math.max(0, lim-usadas), cheio=usadas>=lim;
    var tom=faltaTom(usadas, lim), cor=dark?tom.textD:tom.text;
    var msg = cheio ? 'Limite de '+lim+' faltas atingido.'
            : (rest===1 ? 'Resta <b>1</b> falta antes do limite.' : 'Ainda pode faltar <b>'+rest+'</b> vezes.');
    var ordenadas=sb.absences.slice().sort().reverse();
    var lista = ordenadas.length
      ? '<div class="flist">'+ordenadas.map(function(d,i){
          return '<div class="frow"><span class="fnum">'+(ordenadas.length-i)+'</span>'
            +'<span class="fdate">'+fmtDate(d)+'</span>'
            +'<span class="fwhen">'+relLabel(dayDiff(d))+'</span>'
            +'<button class="icon-btn danger" data-act="delfalta" data-sid="'+sb.id+'" data-d="'+d+'" title="Remover esta falta">'+SVG_TRASH+'</button></div>';
        }).join('')+'</div>'
      : '<div class="fnone">Nenhuma falta registrada.</div>';
    return '<div class="fpanel"><div class="fmsg" style="color:'+cor+'">'+msg+'</div>'
      +lista
      +'<div class="fadd"><input type="date" value="'+todayISO()+'" data-fdate aria-label="Data da falta">'
      +'<button class="btn-wine" data-act="addfalta" data-sid="'+sb.id+'"'+(cheio?' disabled':'')+'>'
      +svg(IC.plus,15)+' Registrar falta</button></div></div>';
  }
  /* Horário e local numa linha só, e só quando existem. */
  function aulaLinha(sb){
    var partes=[];
    var h=horarioTexto(sb);
    if(h) partes.push('<span class="aula-h">'+svg(IC.clock,12)+' '+esc(h)+'</span>');
    if(sb.place) partes.push('<span class="aula-l">'+svg(IC.pin,12)+' '+esc(sb.place)+'</span>');
    if(!partes.length) return '';
    return '<div class="subj-aula">'+partes.join('')+'</div>';
  }
  function driveChip(sb){
    var u=safeUrl(sb.driveLink);
    if(!u) return '';
    return '<a class="chip-btn" href="'+esc(u)+'" target="_blank" rel="noopener">'
      +svg(IC.pasta,14)+'<span class="chip-lbl">Pasta no Drive</span></a>';

  function renderPanel(){
    var s=findSubject(currentSubjectId);
    if(!s){
      panel.innerHTML=''; tagbar.innerHTML=''; foot.innerHTML='';
      tw.innerHTML='<div class="empty"><p class="empty-big">Nenhuma matéria por aqui.</p>'

  function renderTagbar(){
    var tags=allTagsOf(currentSubjectId);
    // filtro de tag que não existe nesta matéria esconderia tudo sem aviso
    if(fTag && tags.indexOf(fTag)<0) fTag='';

    tagbar.innerHTML='<span class="tagbar-lbl">Tags</span>'+tags.map(function(g){

  // ---- render: tabela ----
  function statusPill(t){
    var cfg=STATUS[t.status]||STATUS.nao_lido;
    return '<div class="pill-wrap"><button class="pill" data-act="pill" data-id="'+t.id+'" style="background:'+chipOf(cfg)+';color:'+textOf(cfg)+'" aria-haspopup="true" aria-expanded="'+(openMenuId===t.id)+'">'
      +'<span class="pill-dot" style="background:'+cfg.dot+'"></span>'+esc(rotuloStatus(t))+' '+SVG_CARET+'</button></div>';
  }
  /* O menu vive fora da tabela, em camada fixa: dentro dela ficava recortado
     pelo overflow do contêiner e era difícil de clicar. */
  function renderStatusMenu(){
    var el=document.getElementById('statusmenu');
    var t=openMenuId?findText(openMenuId):null;
    /* A visão escondida guarda o HTML antigo, então o mesmo texto pode ter duas
       pills no documento. Procurar só dentro da visão ativa evita medir a
       escondida, que devolve zero e jogava o menu para o canto da tela. */
    var cont = view==='week' ? weekEl : (view==='tcc' ? tccEl : tw);
    var btn = (t && cont) ? cont.querySelector('.pill[data-act="pill"][data-id="'+openMenuId+'"]') : null;
    if(!t||!btn){ if(el) el.parentNode.removeChild(el); return; }
    var r0=btn.getBoundingClientRect();
    if(!r0.width && !r0.height){ if(el) el.parentNode.removeChild(el); return; }
    menuScroll={x:window.pageXOffset, y:window.pageYOffset};
    if(!el){
      el=document.createElement('div');
      el.id='statusmenu'; el.className='menu'; el.setAttribute('role','menu');
      el.setAttribute('aria-label','Status da leitura');
      /* Sem isto o menu abria mas o foco ficava no <body>: as setas rolavam a
         página (fechando o menu) e o Tab pulava para o topo da tabela. Trocar de
         status era impossível sem mouse. */
      el.addEventListener('keydown', function(ev){
        var itens=Array.prototype.slice.call(el.querySelectorAll('.menu-item'));
        if(!itens.length) return;
        var i=itens.indexOf(document.activeElement);
        if(ev.key==='ArrowDown' || ev.key==='ArrowUp'){
          ev.preventDefault(); ev.stopPropagation();
          var passo = ev.key==='ArrowDown' ? 1 : -1;
          var alvo = itens[(Math.max(i,0)+passo+itens.length)%itens.length];
          if(alvo) alvo.focus();
        } else if(ev.key==='Home' || ev.key==='End'){
          ev.preventDefault(); ev.stopPropagation();
          itens[ev.key==='Home'?0:itens.length-1].focus();
        } else if(ev.key==='Escape' || ev.key==='Tab'){
          // devolve o foco para a pílula que abriu
          var idAberto=openMenuId;
          openMenuId=null; renderMain();
          var volta=document.querySelector('.pill[data-act="pill"][data-id="'+idAberto+'"]');
          if(volta){ ev.preventDefault(); volta.focus(); }
        }
      });
      el.addEventListener('click', function(e){
        var b=e.target.closest('[data-act="setstatus"]'); if(!b) return;
        e.stopPropagation();
        var tx=findText(b.getAttribute('data-id'));
        if(tx) tx.status=b.getAttribute('data-s');
        openMenuId=null; persist(); renderAll();
      });
      app.appendChild(el);
    }
    /* "Estudando" cobre lendo e parcial; se o item JÁ está em parcial, a opção
       fica visível para o menu não ficar sem nenhum item marcado. */
    var ordem = (ehAval(t) && t.status!=='parcial')
      ? STATUS_ORDER.filter(function(st){ return st!=='parcial'; })
      : STATUS_ORDER;
    el.innerHTML=ordem.map(function(st){
      var atual=(st===t.status);
      var rot = ehAval(t) ? (AVAL_LABEL[st]||STATUS[st].label) : STATUS[st].label;
      return '<button class="menu-item" role="menuitemradio" aria-checked="'+atual+'"'
        +' data-act="setstatus" data-id="'+esc(t.id)+'" data-s="'+st+'">'
        +'<span class="pill-dot" aria-hidden="true" style="background:'+STATUS[st].dot+'"></span>'+esc(rot)
        +(atual?'<span class="check" aria-hidden="true">✓</span>':'')+'</button>';
    }).join('');
    var r=r0;
    el.style.visibility='hidden';
    var h=el.offsetHeight, w=el.offsetWidth;
    var top=r.bottom+5, left=r.left;
    if(top+h > window.innerHeight-8) top=r.top-h-5;   // não coube abaixo: abre para cima
    // e, em qualquer caso, mantém o menu inteiro dentro da tela
    top  = Math.min(Math.max(8, top),  Math.max(8, window.innerHeight-h-8));
    left = Math.min(Math.max(8, left), Math.max(8, window.innerWidth-w-8));
    el.style.top=top+'px'; el.style.left=left+'px'; el.style.visibility='';
    /* Se o menu foi aberto pelo teclado, o foco entra nele; aberto pelo mouse,
       fica onde está para não roubar o cursor. */
    if(menuPorTeclado){
      menuPorTeclado=false;
      var atual=el.querySelector('.menu-item[aria-checked="true"]') || el.querySelector('.menu-item');
      if(atual) atual.focus();
    }
  }
  function dateCell(t){
    if(!t.classDate) return '<span class="muted">—</span>';
    var d=dayDiff(t.classDate);
    var cls = d===0 ? 'today' : ((d!=null && d>0 && d<=3) ? 'soon' : '');
    return fmtDate(t.classDate)+'<span class="date-rel '+cls+'">'+relLabel(d)+'</span>';
  }
  /* A avaliação se distingue por uma etiqueta com o tipo, não por outra cor de
     linha — assim ela continua lendo como parte da mesma lista. */
  function avalBadge(t){
    if(!ehAval(t)) return '';
    return '<span class="aval-badge">'+svg(IC.alert,10)+' '+esc(tipoAval(t))+'</span>';
  }
  /* Recua visualmente sem sair do lugar. Vale para tudo cuja aula já passou e,
     além disso, para o que foi lido na aula de hoje — esse também já cumpriu o
     seu papel. O que é de hoje e ainda não foi lido continua em destaque. */
  function jaPassou(t){
    if(!t.classDate) return false;
    var d=dayDiff(t.classDate);
    if(d==null) return false;
    if(d<0) return true;                       // aula já passou
    return d===0 && t.status==='lido';         // é de hoje, mas já está lido
  }
  /* Anel colorido: no próximo texto a cor vem do STATUS (muda conforme avança);
     numa avaliação vem da cor escolhida para o item. Quando o item é os dois, o
     status manda — é a informação mais urgente. */
  /* Uma cor escolhida escura (o vinho, por exemplo) some contra o papel escuro.
     Aqui ela é clareada só o quanto for preciso para o anel aparecer — o matiz
     continua sendo o que a pessoa escolheu. */
  function lumRel(hex){
    var c=hex2rgb(hex).map(function(v){ v/=255;
      return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
    return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
  }
  function razao(a,b){ var x=lumRel(a), y=lumRel(b);
    return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
  function corVisivel(cor){
    if(!dark || !/^#[0-9a-f]{6}$/i.test(cor)) return cor;
    var fundo='#2d2822';                      // --card do tema escuro
    var c=cor;
    for(var i=0;i<12 && razao(c,fundo)<2.6;i++) c=lerpCor(c,'#FFFFFF',0.12);
    return c;
  }
  function corDoAnel(t, isRef){
    if(isRef) return corVisivel((STATUS[t.status]||STATUS.nao_lido).dot);
    if(ehAval(t)) return corVisivel(textColor(t));
    return '';
  }
  function anelAttr(t, isRef){
    if(!contornos) return {cls:'', style:''};
    var c=corDoAnel(t, isRef);
    if(!c) return {cls:'', style:''};
    return {cls:' com-anel', style:'--anel:'+esc(c)+';'};
  }
  function prioBadge(t){
    if(t.priority==='normal') return '';
    return '<span class="prio '+PRIO[t.priority].cls+'">'+PRIO[t.priority].label+'</span>';
  }
  function tagsHtml(t){
    if(!t.tags.length) return '';
    return '<div class="row-tags">'+t.tags.map(function(g){
      return '<button class="rtag" data-act="tagf" data-t="'+esc(g)+'">'+esc(g)+'</button>';
    }).join('')+'</div>';
  }
  function rowHtml(t){
    var color=textColor(t);
    var isRef=!!curRefIds[t.id];
    var refBadge=isRef?'<span class="ref-badge">'+(curRefDiff===0?'hoje':'próxima aula')+'</span>':'';
    var link=ehAval(t)?'':safeUrl(t.link);
    var linkHtml=link?' <a class="text-link" href="'+esc(link)+'" target="_blank" rel="noopener" title="Abrir texto" data-stop>'+SVG_LINK+'</a>':'';
    var m=estMin(t);
    var cls=[]; if(isRef) cls.push('is-ref'); if(ehAval(t)) cls.push('is-aval');
    if(jaPassou(t)) cls.push('ja-passou');
    var anel=anelAttr(t, isRef);
    if(anel.cls) cls.push(anel.cls.trim());
    return '<tr'+(cls.length?' class="'+cls.join(' ')+'"':'')+(anel.style?' style="'+anel.style+'"':'')+'>'
      +'<td class="c-num">'+(t.number!=null
          ? '<span class="num-badge" style="background:'+color+'">'+t.number+'</span>'
          : '<span class="num-vazio" style="border-color:'+color+'" aria-hidden="true"></span>')+'</td>'
      +'<td class="c-text"><span class="text-name">'+esc(t.name)+'</span>'+linkHtml+avalBadge(t)+prioBadge(t)+refBadge
        +(t.notes?'<span class="nota" title="'+esc(t.notes)+'">'+svg(IC.nota,11)+' '+esc(t.notes)+'</span>':'')
        +(t.originalTitle && !ehAval(t)?'<span class="orig">'+esc(t.originalTitle)+'</span>':'')
        +(t.notes?'<span class="nota" title="'+esc(t.notes)+'">'+svg(IC.nota,11)+' '+esc(t.notes)+'</span>':'')
        +tagsHtml(t)+'</td>'
      +'<td class="c-author">'+(t.author && !ehAval(t)?esc(t.author):'<span class="muted">—</span>')+'</td>'
      +'<td class="c-date mono">'+dateCell(t)+'</td>'
      +'<td class="c-est">'+(m!=null?'<span class="est">'+t.pages+' p · '+fmtMin(m)+'</span>'
        :(temProgresso(t)?'':'<span class="muted">—</span>'))+progHtml(t)+'</td>'
      +'<td class="c-status">'+statusPill(t)+'</td>'
      +'<td class="c-actions">'
        +(t.classDate?'<button class="icon-btn" data-act="adiar" data-id="'+esc(t.id)+'" title="Adiar para a próxima aula" aria-label="'+esc('Adiar '+t.name+' para a próxima aula')+'">'+svg(IC.adiar,15)+'</button>':'')
        +'<button class="icon-btn" data-act="edit" data-id="'+esc(t.id)+'" title="Editar" aria-label="'+esc('Editar '+t.name)+'">'+SVG_PENCIL+'</button></td>'
      +'</tr>';
  }
  function cardHtml(t){
    var color=textColor(t);
    var isRef=!!curRefIds[t.id];
    var link=ehAval(t)?'':safeUrl(t.link);
    var d=t.classDate?dayDiff(t.classDate):null;
    var dcls = d===0?'hoje':((d!=null&&d>0&&d<=3)?'soon':'');
    var m=estMin(t);
    var meta=[];
    if(t.author && !ehAval(t)) meta.push(esc(t.author));
    if(t.classDate) meta.push(fmtDate(t.classDate)+' <span class="'+dcls+'">'+relLabel(d)+'</span>');
    if(m!=null) meta.push(t.pages+' p ≈ '+fmtMin(m));
    var anelC=anelAttr(t, isRef);
    // no celular a expectativa é tocar no cartão inteiro, não só no lápis
    return '<div class="tcard'+(isRef?' is-ref':'')+(ehAval(t)?' is-aval':'')+(jaPassou(t)?' ja-passou':'')
      +anelC.cls+'" data-act="abrircard" data-id="'+esc(t.id)+'"'
      +(anelC.style?' style="'+anelC.style+'"':'')+'>'
      +'<div class="tc-top">'+(t.number!=null
          ? '<span class="num-badge" style="background:'+color+'">'+t.number+'</span>'
          : '<span class="num-vazio" style="border-color:'+color+'" aria-hidden="true"></span>')
      +'<div class="tc-main"><span class="text-name">'+esc(t.name)+'</span>'
        +(link?' <a class="text-link" href="'+esc(link)+'" target="_blank" rel="noopener" title="Abrir texto" data-stop>'+SVG_LINK+'</a>':'')
        +avalBadge(t)+prioBadge(t)+(isRef?'<span class="ref-badge">'+(curRefDiff===0?'hoje':'próxima aula')+'</span>':'')
        +(t.originalTitle && !ehAval(t)?'<span class="orig">'+esc(t.originalTitle)+'</span>':'')
        +(meta.length?'<div class="tc-meta">'+meta.join(' · ')+'</div>':'')
        +(t.notes?'<span class="nota" title="'+esc(t.notes)+'">'+svg(IC.nota,11)+' '+esc(t.notes)+'</span>':'')
        +progHtml(t)
        +tagsHtml(t)
      +'</div></div>'
      +'<div class="tc-bottom">'+statusPill(t)
      +'<div class="tc-acts">'+(t.classDate?'<button class="icon-btn" data-act="adiar" data-id="'+esc(t.id)+'" title="Adiar para a próxima aula" aria-label="'+esc('Adiar '+t.name+' para a próxima aula')+'">'+svg(IC.adiar,15)+'</button>':'')
      +'<button class="icon-btn" data-act="edit" data-id="'+esc(t.id)+'" title="Editar" aria-label="'+esc('Editar '+t.name)+'">'+SVG_PENCIL+'</button></div></div>'
      +'</div>';
  }
  function headCell(k,label,cls){
    var on=sortKey===k;
    var arrow=(on && sortDir==='desc')?'▾':'▴';
    var dir = on ? (sortDir==='desc'?'descending':'ascending') : 'none';
    return '<th class="'+cls+' sortable" aria-sort="'+dir+'">'
      +'<button type="button" class="th-btn" data-act="sort" data-k="'+k+'">'+label
      +'<span class="sort-ar" aria-hidden="true" style="opacity:'+(on?1:0.22)+'">'+arrow+'</span></button></th>';
  }
  function renderTable(){
    var s=findSubject(currentSubjectId); if(!s){ tw.innerHTML=''; return; }
    var stRef=subjectStatus(s.id);
    curRefIds={}; curRefDiff=stRef.diff;
    stRef.group.forEach(function(t){ curRefIds[t.id]=1; });

    var list=currentTexts();
    var totalSubj=textsOf(s.id).length;
    var html='';
    if(list.length===0){
      html='<div class="empty">'+(totalSubj===0
        ? '<p class="empty-big">Nenhum texto nesta matéria ainda.</p><p>Clique em <strong>Adicionar</strong> para começar.</p>'
        : (soPendentes && !query && !fTag
            ? '<p class="empty-big">Tudo lido nesta matéria.</p><button class="btn-ghost sm" data-act="verpend">Mostrar também os lidos</button>'
            : '<p class="empty-big">Nenhum texto encontrado.</p><button class="btn-ghost sm" data-act="clearsearch">Limpar busca e filtros</button>'))+'</div>';
    } else if(narrow){
      html='<div class="tcards">'+list.map(cardHtml).join('')+'</div>';
    } else {
      var head='<thead><tr>'
        +headCell('number','Nº','c-num')

  // ---- render: visão semana ----
  function weekData(){
    var t0=todayISO();
    var g={late:[], today:[], tomorrow:[], soon:[], later:[]};
    texts.forEach(function(t){
      if(!t.classDate) return;
      var d=dayDiff(t.classDate,t0);
      if(d==null) return;
      if(d<0){ if(t.status!=='lido') g.late.push(t); }
      else if(d===0) g.today.push(t);
      else if(d===1) g.tomorrow.push(t);
      else if(d<=7) g.soon.push(t);
      else g.later.push(t);
    });
    var by=function(a,b){
      if(a.classDate!==b.classDate) return a.classDate<b.classDate?-1:1;
      var pa=PRIO_ORDER.indexOf(a.priority), pb=PRIO_ORDER.indexOf(b.priority);
      if(pa!==pb) return pa-pb;
      return (a.number==null?Infinity:a.number)-(b.number==null?Infinity:b.number);
    };
    Object.keys(g).forEach(function(k){ g[k].sort(by); });
    return g;
  }
  function weekItem(t){

        +avalBadge(t)+prioBadge(t)

        +'<div class="wmeta">'+(t.number!=null?'nº '+t.number+' · ':'')+fmtDate(t.classDate)+' · '+relLabel(dayDiff(t.classDate))
        +(t.author && !ehAval(t)?' · '+esc(t.author):'')+(m!=null?' · '+t.pages+' p ≈ '+fmtMin(m):'')
        +'</div>'+progHtml(t)+'</div>'

        +(t.classDate?'<button class="icon-btn" data-act="adiar" data-id="'+esc(t.id)+'" title="Adiar para a próxima aula" aria-label="'+esc('Adiar '+t.name+' para a próxima aula')+'">'+svg(IC.adiar,15)+'</button>':'')
        +'<button class="icon-btn" data-act="edit" data-id="'+esc(t.id)+'" title="Editar" aria-label="'+esc('Editar '+t.name)+'">'+SVG_PENCIL+'</button></div>'

  // ---- faltas ----
  function faltaTom(usadas, limite){
    var rest=limite-usadas;
    if(rest<=0) return EMDIA.todo;
    if(rest<=2) return {dot:STATUS.lendo.dot, text:STATUS.lendo.text, textD:STATUS.lendo.textD};
    return {dot:STATUS.lido.dot, text:STATUS.lido.text, textD:STATUS.lido.textD};
  }
  /* Um toque duplo no botão gravava duas faltas na mesma data, em silêncio — e
     é esse número que decide reprovação por falta. */
  function addFalta(sid, d){
    var sb=findSubject(sid); if(!sb) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')){ alert('Escolha uma data válida para a falta.'); return; }
    if(sb.absences.indexOf(d)>=0){
      anunciar('Já existe uma falta em '+fmtDate(d));
      alert('Já há uma falta registrada em '+fmtDate(d)+'.\n\nCada dia conta uma vez só.');
      return; }
    if(sb.absences.length>=sb.absenceLimit){ alert('Limite de '+sb.absenceLimit+' faltas já atingido em '+sb.name+'.'); return; }
    sb.absences.push(d);
    anunciar('Falta registrada em '+fmtDate(d));
    persist(); renderAll();
  }
  function delFalta(sid, d){
    var sb=findSubject(sid); if(!sb) return;
    var i=sb.absences.indexOf(d);
    if(i>=0) sb.absences.splice(i,1);
    persist(); renderAll();
  }


  // ================= ABA TCC =================
  var MES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function d2n(iso){ var p=String(iso).split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
  function n2d(ms){ var d=new Date(ms); var p=function(n){ return (n<10?'0':'')+n; };
    return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate()); }
  var DIA=86400000;

  function etapasOrd(){
    return tcc.etapas.slice().sort(function(a,b){
      var sa=a.start||a.end||'￿', sb=b.start||b.end||'￿';
      if(sa!==sb) return sa<sb?-1:1;
      var ea=a.end||'￿', eb=b.end||'￿';
      if(ea!==eb) return ea<eb?-1:1;
      return COLL.compare(a.name||'', b.name||'');
    });
  }
  function etapaAtrasada(e){
    return e.status!=='done' && e.end && dayDiff(e.end)<0;
  }
  // termina depois da data de entrega: o plano não cabe no prazo
  function etapaPassaDoPrazo(e){
    return !!(tcc.prazo && e.end && e.end>tcc.prazo && e.status!=='done');
  }
  function orientOrd(){
    // sem data vai para o fim; entre datas, a mais recente primeiro
    return tcc.orientacoes.slice().sort(function(a,b){
      var da=a.date||'', db=b.date||'';
      if(!da && !db) return 0;
      if(!da) return 1;
      if(!db) return -1;
      return da<db?1:da>db?-1:0;
    });
  }
  /* O destaque de "próximos passos" é da última conversa que JÁ aconteceu —
     uma reunião marcada para a semana que vem não manda em nada ainda. */
  function ultimaOrientacao(lista){
    for(var i=0;i<lista.length;i++){
      var d=lista[i].date;
      if(d && dayDiff(d)<=0) return lista[i].id;
    }
    return lista.length && !lista[0].date ? null : (lista[0]?lista[0].id:null);
  }

  /* Janela do cronograma: cobre todas as etapas datadas, mais o prazo e o dia
     de hoje, para que a linha do "hoje" nunca fique fora do desenho. */
  function janelaCrono(){
    var ds=[];
    tcc.etapas.forEach(function(e){ if(e.start) ds.push(e.start); if(e.end) ds.push(e.end); });
    if(tcc.prazo) ds.push(tcc.prazo);
    if(!ds.length) return null;
    ds.push(todayISO());
    ds.sort();
    var ini=d2n(ds[0]), fim=d2n(ds[ds.length-1]);
    // arredonda para o começo do mês inicial e o fim do mês final
    var a=new Date(ini), b=new Date(fim);
    var t0=Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1);
    var t1=Date.UTC(b.getUTCFullYear(), b.getUTCMonth()+1, 1)-DIA;
    if(t1<=t0) t1=t0+30*DIA;
    /* Janela absurda (uma etapa datada em 2019, por engano) espremeria tudo em
       nada. Recorta em 60 meses a partir do início — o cabeçalho e as barras
       continuam falando do mesmo intervalo. */
    var MAX=Date.UTC(new Date(t0).getUTCFullYear()+5, new Date(t0).getUTCMonth()+1, 1)-DIA;
    if(t1>MAX) t1=MAX;
    return {t0:t0, t1:t1, span:(t1-t0)};
  }
  function mesesDe(j){
    var out=[], d=new Date(j.t0);
    var y=d.getUTCFullYear(), m=d.getUTCMonth();
    while(true){
      var ini=Date.UTC(y,m,1), fim=Date.UTC(y,m+1,1)-DIA;
      if(ini>j.t1) break;
      out.push({y:y, m:m, ini:Math.max(ini,j.t0), fim:Math.min(fim,j.t1)});
      m++; if(m>11){ m=0; y++; }
    }
    return out;
  }
  /* O eixo cobre DIAS INTEIROS: de 00h do primeiro até 24h do último. Usar
     j.span (que é um dia a menos) desalinhava as divisórias do cabeçalho e
     fazia o último dia da janela ter largura zero. */
  function pctDe(j, ms){ return Math.max(0, Math.min(100, (ms-j.t0)/(j.span+DIA)*100)); }

  function renderGantt(j){
    var meses=mesesDe(j);
    var largs=meses.map(function(mm){ return ((mm.fim+DIA-mm.ini)/(j.span+DIA))*100; });
    var hojeMs=d2n(todayISO());
    var marca = (hojeMs>=j.t0 && hojeMs<=j.t1)
      ? '<div class="ghoje" style="left:'+pctDe(j,hojeMs).toFixed(3)+'%"></div>' : '';

    var cab='<div class="grow ghead"><div class="gcell-l">Etapa</div><div class="gmeses">'
      +meses.map(function(mm,i){
          return '<div class="gmes" style="flex:'+largs[i].toFixed(4)+'">'
            +MES_ABR[mm.m]+(mm.m===0||i===0?' <span style="opacity:.6">'+String(mm.y).slice(2)+'</span>':'')+'</div>';
        }).join('')
      +marca+'</div></div>';
    var grade = meses.slice(1).map(function(mm){
      return '<div class="gsep" style="left:'+pctDe(j,mm.ini).toFixed(3)+'%"></div>'; }).join('');

    var linhas=etapasOrd().map(function(e){
      var cfg=ETAPA[e.status], late=etapaAtrasada(e);
      var quando = (e.start||e.end)
        ? (e.start?fmtDate(e.start):'início em aberto')+' → '+(e.end?fmtDate(e.end):'fim em aberto')
        : 'sem datas';
      var barra;
      if(e.start || e.end){
        // sem uma das pontas a barra segue até a borda da janela, em vez de
        // virar um bloco de um dia que contradiz a legenda "→ ?"
        var a = e.start ? d2n(e.start) : j.t0;
        var b = e.end   ? d2n(e.end)   : j.t1;
        if(b<a){ var tmp=a; a=b; b=tmp; }
        var l=pctDe(j,a), r=pctDe(j,b+DIA);
        var w=Math.max(Math.min(r,100)-l, 1.2);
        if(l+w>100) l=Math.max(0, 100-w);   // encosta na borda direita, sem passar dela
        var aberta=(!e.start||!e.end)?' aberta':'';
        // barra curta demais para caber um nome fica só com a cor e o title
        barra='<button type="button" class="gbar'+aberta+'" data-act="etedit" data-id="'+esc(e.id)+'" '
          +'aria-label="'+esc(e.name+' — '+cfg.label+(late?', em atraso':'')+', '+quando)+'" '
          +'style="left:'+l.toFixed(3)+'%; width:'+w.toFixed(3)+'%; background-color:'+etapaCor(cfg,late)+'">'
          +(w>=9?'<span>'+esc(e.name)+'</span>':'')+'</button>';
      } else {
        barra='<div class="gsem">sem datas</div>';
      }
      return '<div class="grow'+(late?' late':'')+(etapaPassaDoPrazo(e)?' fora-do-prazo':'')+'">'
        +'<div class="gcell-l" data-act="etedit" data-id="'+esc(e.id)+'" role="button" tabindex="0"'
          +' aria-label="'+esc('Editar a etapa '+e.name)+'"><div class="gname">'
          +'<span class="gdot" style="background:'+etapaCor(cfg,false)+'"></span>'
          +'<span class="gtitulo">'+esc(e.name)+'</span></div>'
          +'<span class="gwhen">'+esc((e.start?fmtDate(e.start):'?')+' → '+(e.end?fmtDate(e.end):'?'))+'</span></div>'
        +'<div class="gtrack">'+grade+marca+barra+'</div></div>';
    }).join('');

    return '<div class="gantt"><div class="gantt-scroll"><div class="gantt-in">'+cab+linhas+'</div></div></div>';
  }

  function renderEtapasLista(){
    return '<div class="elist">'+etapasOrd().map(function(e){
      var cfg=ETAPA[e.status], late=etapaAtrasada(e);
      var meta=[];
      if(e.start && e.end) meta.push(fmtDate(e.start)+' → '+fmtDate(e.end));
      else if(e.end) meta.push('até '+fmtDate(e.end));
      else if(e.start) meta.push('a partir de '+fmtDate(e.start));
      else meta.push('sem datas');
      if(etapaPassaDoPrazo(e)) meta.push('<span class="atras">termina depois da entrega</span>');
      if(e.status!=='done' && e.end){
        var d=dayDiff(e.end);
        if(d<0) meta.push('<span class="atras">'+Math.abs(d)+' '+(Math.abs(d)===1?'dia':'dias')+' em atraso</span>');
        else if(d===0) meta.push('<span class="agora">termina hoje</span>');
        else if(d<=14) meta.push('<span class="agora">faltam '+d+' '+(d===1?'dia':'dias')+'</span>');
        else meta.push('faltam '+d+' dias');
      }
      var cor=dark?{bg:cfg.chipD,fg:cfg.textD}:{bg:cfg.chip,fg:cfg.text};
      return '<div class="eitem'+(late?' late':'')+(e.status==='done'?' done':'')+'">'
        +'<span class="edot" style="background:'+etapaCor(cfg,late)+'"></span>'
        +'<div class="emain"><div class="ename">'+esc(e.name)+'</div>'
          +'<div class="emeta">'+meta.join(' · ')+'</div>'
          +(e.notes?'<div class="enotes">'+esc(e.notes)+'</div>':'')
        +'</div>'
        +'<div class="eacts">'
          +'<button class="echip" data-act="etciclo" data-id="'+esc(e.id)+'" title="Trocar o status"'
            +' aria-label="'+esc(e.name+': '+cfg.label+'. Trocar o status')+'"'
            +' style="background:'+cor.bg+'; color:'+cor.fg+'">'+cfg.label+'</button>'
          +'<button class="icon-btn" data-act="etedit" data-id="'+esc(e.id)+'" aria-label="'+esc('Editar a etapa '+e.name)+'" title="Editar etapa">'+SVG_PENCIL+'</button>'
        +'</div></div>';
    }).join('')+'</div>';
  }

  function renderEtapas(){
    var n=tcc.etapas.length;
    if(!n){
      return '<div class="tcc-vazio"><p>Nenhuma etapa ainda.</p>'
        +'<span class="hint">Você pode começar do zero ou partir de um roteiro comum de TCC e ajustar depois.</span>'
        +'<div class="acoes"><button class="btn-wine" data-act="etsugerir">'+svg(IC.plus,15)+' Usar etapas sugeridas</button>'
        +'<button class="btn-ghost" data-act="etnova">Criar uma etapa</button></div></div>';
    }
    var feitas=0; tcc.etapas.forEach(function(e){ if(e.status==='done') feitas++; });
    var pct=Math.round(feitas/n*100);
    var j=janelaCrono();
    var podeGantt=!!j;
    var corpo = (cronoModo==='gantt' && podeGantt) ? renderGantt(j)
      : (cronoModo==='gantt'
          ? '<div class="crono-aviso">'+svg(IC.alert,14)+' Nenhuma etapa tem data ainda — dá para ver em barras assim que você preencher os prazos.</div>'
            +renderEtapasLista()
          : renderEtapasLista());
    return '<div class="tcc-prog" title="'+feitas+' de '+n+' concluídas"><span style="width:'+pct+'%"></span></div>'+corpo;
  }

  function renderOrientacoes(){
    var lista=orientOrd();
    if(!lista.length){
      return '<div class="tcc-vazio"><p>Nenhuma orientação registrada.</p>'
        +'<span class="hint">Anote o que foi combinado em cada conversa — na semana seguinte isso vale ouro.</span>'
        +'<div class="acoes"><button class="btn-wine" data-act="ornova">'+svg(IC.plus,15)+' Registrar orientação</button></div></div>';
    }
    var idUltima=ultimaOrientacao(lista);
    return '<div class="olist">'+lista.map(function(o,i){
      var d=o.date?dayDiff(o.date):null;
      var ehUltima=(o.id===idUltima);
      return '<div class="oitem'+(ehUltima?' ultima':'')+(d!=null&&d>0?' futura':'')+'">'
        +'<div class="odate"><b>'+(o.date?fmtDate(o.date):'sem data')+'</b>'
          +(d!=null?'<span>'+(d>0?'marcada · ':'')+relLabel(d)+'</span>':'')+'</div>'
        +'<div class="omain">'
          +(o.combinado?'<div class="olabel">O que foi conversado</div><div class="otxt">'+esc(o.combinado)+'</div>':'')
          +(o.proximos?'<div class="oprox">'+(ehUltima?'<span class="obadge">próximos passos</span>':'<div class="olabel">Próximos passos</div>')
              +'<div class="otxt">'+esc(o.proximos)+'</div></div>':'')
          +(!o.combinado && !o.proximos?'<div class="otxt" style="color:var(--faint)">Sem anotações.</div>':'')
        +'</div>'
        +'<div class="eacts"><button class="icon-btn" data-act="oredit" data-id="'+esc(o.id)+'" '
          +'aria-label="'+esc('Editar a orientação de '+(o.date?fmtDate(o.date):'sem data'))+'" title="Editar registro">'+SVG_PENCIL+'</button></div>'
        +'</div>';
    }).join('')+'</div>';
  }

  function renderPrazo(){
    if(!tcc.prazo){
      return '<div class="prazo"><span class="prazo-ic">'+svg(IC.cal,17)+'</span>'
        +'<div class="prazo-main"><div class="prazo-t">Sem prazo definido</div>'
        +'<div class="prazo-d">Defina a data-limite para acompanhar a contagem regressiva.</div></div>'
        +'<button class="btn-ghost sm" data-act="tccedit">Definir</button></div>';
    }
    var d=dayDiff(tcc.prazo);
    var cls = d<0 ? 'urgente' : (d<=30 ? (d<=7?'urgente':'perto') : '');
    var n, un;
    if(d<0){ n=Math.abs(d); un=(n===1?'dia atrás':'dias atrás'); }
    else if(d===0){ n='hoje'; un=''; }
    else if(d<21){ n=d; un=(d===1?'dia':'dias'); }
    else { n=Math.floor(d/7); un=(n===1?'semana':'semanas'); }
    var barra='';
    var j0=tcc.etapas.reduce(function(acc,e){ var v=e.start||e.end; return (v && (!acc || v<acc))?v:acc; }, '');
    if(j0 && j0<tcc.prazo){
      var tot=(d2n(tcc.prazo)-d2n(j0))/DIA, feito=(d2n(todayISO())-d2n(j0))/DIA;
      var pct=Math.max(0, Math.min(100, Math.round(feito/tot*100)));
      barra='<div class="prazo-bar" title="'+pct+'% do tempo planejado já passou"><span style="width:'+pct+'%"></span></div>';
    }
    return '<div class="prazo '+cls+'"><span class="prazo-ic">'+svg(IC.clock,17)+'</span>'
      +'<div class="prazo-main"><div class="prazo-t">'+esc(tcc.prazoLabel)+' · '+fmtDate(tcc.prazo)+'</div>'
      +'<div class="prazo-d">'+(d<0?'O prazo já passou.':(d===0?'É hoje.':'Contando a partir de hoje.'))+'</div>'
      +barra+'</div>'
      +'<div class="prazo-n">'+n+(un?'<small>'+un+'</small>':'')+'</div></div>';
  }

  /* O rodapé é global: sem isto a aba TCC ficava exibindo a contagem de textos

  function rodapeTcc(){
    var n=tcc.etapas.length, feitas=0;
    tcc.etapas.forEach(function(e){ if(e.status==='done') feitas++; });
    var atrasadas=tcc.etapas.filter(etapaAtrasada).length;
    var partes=[];
    partes.push(n ? feitas+' de '+n+' etapa(s) concluída(s)' : 'Nenhuma etapa cadastrada');
    if(atrasadas) partes.push(atrasadas+' em atraso');
    if(tcc.orientacoes.length) partes.push(tcc.orientacoes.length+' orientação(ões) registrada(s)');
    return esc(partes.join(' · '))+' · salvo neste navegador<br>'
      +'<span class="kbd">n</span> nova etapa · <span class="kbd">t</span> voltar · <span class="kbd">Esc</span> fechar'

  function cicloEtapa(id){
    var e=null; tcc.etapas.forEach(function(x){ if(x.id===id) e=x; });
    if(!e) return;

  /* Distribui as etapas sugeridas entre hoje e o prazo (ou 4 meses, se não
     houver prazo), proporcionalmente ao peso de cada uma. */
  function criarEtapasSugeridas(){
    var t0=d2n(todayISO());
    var t1=tcc.prazo && d2n(tcc.prazo)>t0 ? d2n(tcc.prazo) : t0+120*DIA;
    var total=ETAPAS_SUGERIDAS.reduce(function(a,e){ return a+e.peso; },0);
    /* A conta é feita em DIAS, não em milissegundos: senão duas etapas caem no
       mesmo dia e o "fim" chega a ficar antes do "início". Cada etapa recebe ao
       menos um dia, e a última encosta no prazo. */
    var dias=Math.max(ETAPAS_SUGERIDAS.length, Math.round((t1-t0)/DIA));
    var acc=0, usados=0;
    ETAPAS_SUGERIDAS.forEach(function(base, i){
      acc+=base.peso;
      var ini=usados;
      var alvo=Math.round((acc/total)*dias);
      var restantes=ETAPAS_SUGERIDAS.length-1-i;
      var fim=Math.min(Math.max(alvo, ini+1), dias-restantes);
      usados=fim;
      tcc.etapas.push(normEtapa({name:base.name, start:n2d(t0+ini*DIA), end:n2d(t0+(fim-1)*DIA)}));
    });
    persist(); renderTcc();
  }

  function quandoTxt(iso){
    if(!iso) return '';
    /* iso vem de toISOString() (UTC). Fatiar a string dava o dia UTC, que à
       noite no Brasil já é o dia seguinte — o botão dizia "Sincronizado ·
       amanhã" logo após sincronizar. O dia tem de ser o LOCAL. */
    var q=new Date(iso); if(isNaN(q.getTime())) return '';
    var d=dayDiff(diaLocal(q));
    var min=Math.round((Date.now()-new Date(iso).getTime())/60000);
    if(d===0) return min<1?'agora':(min<60?'há '+min+' min':'hoje');
    return relLabel(d);
  }

  /* Toda ação da lista redesenha o HTML e destrói o botão que estava focado —
     o foco caía no <body> e quem navega por teclado voltava ao topo da página a
     cada clique. Aqui a identidade do controle é guardada antes e recuperada

  function marcaDoFoco(){
    var el=document.activeElement;
    if(!el || el===document.body) return null;
    var alvo=el.closest('[data-act]');
    if(!alvo) return el.id ? {id:el.id} : null;
    return {act:alvo.getAttribute('data-act'), tid:alvo.getAttribute('data-id'),
            k:alvo.getAttribute('data-k'), t:alvo.getAttribute('data-t')};
  }
  function devolverFoco(m){

    var sel;
    if(m.id){ sel='#'+m.id; }
    else {
      sel='[data-act="'+m.act+'"]';
      if(m.tid) sel+='[data-id="'+m.tid+'"]';
      if(m.k) sel+='[data-k="'+m.k+'"]';
      if(m.t) sel+='[data-t="'+m.t+'"]';
    }
    var el;
    try{ el=document.querySelector(sel); }catch(e){ return; }
    if(el && el.focus) try{ el.focus({preventScroll:true}); }catch(e2){ el.focus(); }
  }

  // ---- modais ----
  function modalOpen(){ return !!document.getElementById('overlay'); }
  function closeModal(){
    var o=document.getElementById('overlay'); if(o) o.parentNode.removeChild(o);
    // devolve o foco para o botão que abriu o modal, se ele ainda existir
    if(focoAnterior && document.contains(focoAnterior)){ try{ focoAnterior.focus(); }catch(e){} }
    focoAnterior=null;
  }
  var focoAnterior=null;
  /* Um modal precisa (a) receber o foco, (b) segurar o Tab dentro dele e
     (c) devolver o foco a quem o abriu. Sem isso, quem navega por teclado sai
     do modal sem perceber e fica preso no fundo da página. */
  function focaveis(el){
    return Array.prototype.filter.call(
      el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
      function(n){ return n.offsetWidth>0 || n.offsetHeight>0 || n===document.activeElement; });
  }
  function prenderFoco(overlay){
    overlay.addEventListener('keydown', function(e){
      if(e.key!=='Tab') return;
      var f=focaveis(overlay); if(!f.length) return;
      var pri=f[0], ult=f[f.length-1];
      if(e.shiftKey && document.activeElement===pri){ e.preventDefault(); ult.focus(); }
      else if(!e.shiftKey && document.activeElement===ult){ e.preventDefault(); pri.focus(); }
    });
  }
  /* Enter dentro de um modal não pode disparar a ação principal quando o foco
     está no Cancelar ou no X — era assim que o primeiro Enter de quem navega
     por teclado adiava um texto sem querer. */
  function enterConfirma(overlay, acao){
    overlay.addEventListener('keydown', function(e){
      if(e.key!=='Enter') return;
      var alvo=e.target;
      if(alvo && (alvo.tagName==='TEXTAREA' || alvo.tagName==='BUTTON' || alvo.tagName==='A')) return;
      e.preventDefault(); acao();
    });
  }
  function buildOverlay(html){
    closeModal();
    // um menu flutuante aberto não pode sobreviver por cima do modal
    if(openMenuId!==null){ openMenuId=null; renderStatusMenu(); }
    var overlay=document.createElement('div');
    overlay.className='overlay'; overlay.id='overlay';
    overlay.innerHTML=html;
    app.appendChild(overlay);
    overlay.addEventListener('mousedown', function(e){ if(e.target===overlay) closeModal(); });
    focoAnterior = (document.activeElement && document.activeElement!==document.body) ? document.activeElement : null;
    // o <h2> do cabeçalho nomeia o diálogo
    var cx=overlay.querySelector('.modal-head h2');
    var dlg=overlay.querySelector('.modal');
    if(cx && dlg){ cx.id='modal-titulo'; dlg.setAttribute('aria-labelledby','modal-titulo'); }
    prenderFoco(overlay);
    // se ninguém pedir foco explicitamente, ele começa no diálogo mesmo assim
    setTimeout(function(){
      if(!overlay.parentNode) return;
      if(overlay.contains(document.activeElement)) return;
      var f=focaveis(overlay);
      if(f.length) f[0].focus();
    }, 0);
    return overlay;
  }

  function saveText(existing, chosen, kind){
