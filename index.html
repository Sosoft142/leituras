       "Avaliação" zerava autor, páginas e link em silêncio, e desmarcar não
       trazia nada de volta. Eles apenas não são exibidos numa avaliação. */
    var data={ subjectId:g('m_subj'), number:num(g('m_num')), name:name,
      kind: aval?'aval':'texto', avalType:g('m_avaltipo'),
      originalTitle:g('m_orig').trim(), author:g('m_author').trim(),
      classDate:g('m_date'), link:g('m_link').trim(), status:g('m_status'),
      priority:g('m_prio'), pages:num(g('m_pages')),
      pagesRead:num(g('m_pagesread')),
      tags:g('m_tags').split(',').map(function(x){ return x.trim(); }).filter(Boolean),
      color:chosen.val, notes:g('m_notes') };
    if(existing) Object.assign(existing, normText(Object.assign({id:existing.id}, data)));
    else texts.push(normText(data));
    currentSubjectId=data.subjectId;
    ajustarMateriaAtual();   // a matéria do TCC não pode virar a matéria aberta
    closeModal(); persist(); renderAll();
  }

  function saveSubject(existing, chosen){
    var g=function(id){ return document.getElementById(id).value; };
    var name=g('s_name').trim();
    if(!name){ var el=document.getElementById('s_name'); el.classList.add('invalid');
      var em=document.getElementById('s_err'); if(em) em.style.display=''; el.focus(); return; }
    var lim=num(g('s_lim')); if(lim==null||lim<0) lim=0;
    var ehTcc=!!document.getElementById('s_tcc').checked;
    var data={ name:name, professor:g('s_prof').trim(), color:chosen.val,
      absenceLimit:Math.min(lim,30), driveLink:g('s_drive').trim(), tcc:ehTcc,
      schedule:g('s_hor').trim(), place:g('s_local').trim() };
    // só pode existir uma matéria de TCC — marcar uma desmarca a anterior
    if(ehTcc) subjects.forEach(function(x){ if(x!==existing) x.tcc=false; });
    var eraTcc = !!(existing && existing.tcc);
    // normalizar também ao EDITAR: senão "  35m12  " ficava salvo cru
    if(existing) Object.assign(existing, normSubject(Object.assign({}, existing, data)));
    else { var ns=normSubject(data); subjects.push(ns);
      if(ehTcc){ view='tcc'; } else { currentSubjectId=ns.id; view='subject'; } }
    // desmarcou o TCC: a matéria volta para a faixa e é ela que deve abrir
    if(existing && eraTcc && !ehTcc){ currentSubjectId=existing.id; view='subject'; }
    // marcou a matéria aberta como TCC: leva a pessoa para a aba, sem sumiço mudo
    if(existing && !eraTcc && ehTcc) view='tcc';
    if(ehTcc && !tcc.orientadora && data.professor) tcc.orientadora=data.professor;
    closeModal(); ajustarMateriaAtual(); persist(); saveUI(); renderAll();
  }
  /* Adiar = empurrar para a PRÓXIMA data de aula da matéria, lida do código de
     horário. Aula desmarcada normalmente arrasta o resto do plano junto, por
     isso a pergunta sobre os subsequentes. */
  /* Tudo que vem DEPOIS, incluindo os irmãos da MESMA aula: se a aula caiu, os
     dois textos dela caem junto. Antes o critério era ">" e o irmão ficava
     sozinho na aula cancelada. */
  function depoisDe(t, incluirAval){
    if(!t.classDate) return [];
    return texts.filter(function(x){
      if(x.subjectId!==t.subjectId || x.id===t.id || !x.classDate) return false;
      if(!incluirAval && ehAval(x)) return false;
      return x.classDate>=t.classDate;
    }).sort(function(a,b){
      if(a.classDate!==b.classDate) return a.classDate<b.classDate?-1:1;
      var na=a.number==null?Infinity:a.number, nb=b.number==null?Infinity:b.number;
      return na===nb ? 0 : na-nb;
    });
  }

    var leiturasSeg=depoisDe(t, false);

      +'</div>'
      +(leiturasSeg.length
        ? '<label class="opt-check"><input type="checkbox" id="ad_todos" checked>'

        : '<p class="hint" style="margin:0 0 13px">Não há outra leitura depois desta nesta matéria.</p>')
      +(avalSeg.length
        ? '<label class="opt-check"><input type="checkbox" id="ad_aval">'
          +'<span><b>Adiar também '+esc(plural(avalSeg.length,'a avaliação seguinte','avaliações seguintes'))+'</b>'
          +'<span class="hint">Fora por padrão: data de prova costuma ser marcada pelo professor e não anda junto com a leitura.</span></span></label>'
        : '')
      +'<div class="modal-foot"><button class="btn-ghost" data-cancel>Cancelar</button>'

      +'</div>';
    var overlay=buildOverlay(html);

      if(jaConfirmou) return;              // dois cliques no mesmo instante
      jaConfirmou=true;

      adiarTexto(t, !!(cx && cx.checked), !!(cv && cv.checked));
      closeModal();

    overlay.querySelector('[data-cancel]').addEventListener('click', closeModal);
    overlay.querySelector('[data-save]').addEventListener('click', confirmar);

  /* Plano de adiamento — usado TANTO pela pré-visualização do modal QUANTO pela
     aplicação, para os dois nunca discordarem.

     Cada item anda a partir da SUA própria data, para o espaçamento do plano de
     leitura ser preservado: se os textos estavam de semana em semana, continuam
     de semana em semana. Encadear cada um na data nova do anterior (o que eu
     fazia antes) recompactava tudo em aulas consecutivas e chegava a puxar
     leituras para DATAS ANTERIORES às que já tinham.

     Duas regras cuidam do resto:
     - quem está atrasado parte de hoje, senão só andaria para outro dia no
       passado;
     - se mesmo assim um item alcançaria o anterior, ele é empurrado mais uma
       aula. Assim nada colide e nada anda para trás.
     Itens da MESMA aula formam um grupo e recebem a mesma data nova. */
  function planoAdiamento(t, comLeituras, comAvaliacoes){
    var sb=findSubject(t.subjectId), hoje=todayISO();
    var lista=[t];
    if(comLeituras) lista=lista.concat(depoisDe(t, false));
    if(comAvaliacoes) lista=lista.concat(texts.filter(function(x){
      return x.subjectId===t.subjectId && x.id!==t.id && ehAval(x) && x.classDate && x.classDate>=t.classDate; }));
    // sem duplicar, e em ordem de data
    var vistos={}, fila=[];
    lista.forEach(function(x){ if(!vistos[x.id]){ vistos[x.id]=1; fila.push(x); } });
    fila.sort(function(a,b){ return a.classDate<b.classDate?-1:a.classDate>b.classDate?1:0; });

    var novaDe={}, ultima=null;
    fila.forEach(function(x){
      if(!novaDe.hasOwnProperty(x.classDate)){
        var base = (x.classDate < hoje) ? hoje : x.classDate;
        var nova = proximaAula(sb, base);
        if(ultima && nova <= ultima) nova = proximaAula(sb, ultima);
        novaDe[x.classDate]=nova; ultima=nova;
      }
    });
    return fila.map(function(x){ return {item:x, de:x.classDate, para:novaDe[x.classDate]}; });
  }
  function adiarTexto(t, comLeituras, comAvaliacoes){
    var plano=planoAdiamento(t, comLeituras, comAvaliacoes);
    var destino=plano.length?plano[0].para:t.classDate;
    plano.forEach(function(p){ if(p.item===t) destino=p.para; });
    plano.forEach(function(p){ p.item.classDate=p.para; });
    anunciar(plano.length===1 ? 'Adiado para '+fmtDate(destino)
                              : plano.length+' itens adiados uma aula');
    persist(); renderAll();
  }
  function deleteText(id){
    var t=findText(id); if(!t) return;
    if(!confirm('Remover o texto "'+t.name+'"?\n\nEsta ação não pode ser desfeita.')) return;
    closeModal();
    texts=texts.filter(function(x){ return x.id!==id; });
    openMenuId=null;

  /* Editor rápido de "páginas lidas": clicar no número troca por um campo.
     Fica no escopo geral porque as três visões usam. */
  function abrirEdicaoPaginas(btn){
    var id=btn.getAttribute('data-id');
    var t=findText(id); if(!t) return;
    var inp=document.createElement('input');
    inp.type='number'; inp.className='pedit-inp'; inp.min='0';
    inp.setAttribute('inputmode','numeric');
    inp.setAttribute('aria-label','Páginas lidas');
    if(t.pages!=null) inp.max=String(t.pages);
    inp.value = (t.pagesRead!=null ? t.pagesRead : '');
    btn.parentNode.replaceChild(inp, btn);
    inp.focus(); inp.select();
    /* No celular o teclado sobe e cobre a metade de baixo da tela: sem isto o
       campo que acabou de abrir some justamente enquanto se digita nele. Só
       centralizar não bastava — no fim da lista não havia rolagem sobrando,
       então a classe abre um vão temporário embaixo. */
    var folga = isNarrow();
    if(folga) document.body.classList.add('com-teclado');
    try{ inp.scrollIntoView({block:'center', behavior:'auto'}); }catch(e){ try{ inp.scrollIntoView(false); }catch(e2){} }
    var fechado=false;
    function encerrar(salvar){
      if(fechado) return; fechado=true;
      document.body.classList.remove('com-teclado');
      if(salvar){
        var txt=inp.value.trim();
        var n0=num(txt);
        var v = (txt===''||n0==null) ? null : Math.max(0, Math.floor(n0));
        if(v!=null && t.pages!=null && v>t.pages) v=t.pages;
        var mudou = (v!==t.pagesRead);
        if(mudou) t.pagesRead=v;
        /* Chegar na última página é dizer "acabei". Sem isto a linha mostrava
           "20/20 · tudo lido" com a pílula ainda em "Lendo", e o topo da página
           seguia contando a matéria como pendente. */
        if(v!=null && t.pages!=null && t.pages>0 && v>=t.pages && t.status!=='lido'){
          t.status='lido'; mudou=true;
          anunciar(t.name+' marcado como lido');
        }
        if(mudou) persist();
      }
      renderAll();
    }
    inp.addEventListener('keydown', function(ev){
      ev.stopPropagation();
      if(ev.key==='Enter'){ ev.preventDefault(); encerrar(true); }
      else if(ev.key==='Escape'){ ev.preventDefault(); encerrar(false); }
    });
    inp.addEventListener('blur', function(){ encerrar(true); });
    inp.addEventListener('click', function(ev){ ev.stopPropagation(); });
  }

  /* Todos os cliques da aba TCC passam por aqui. */
  function tccActions(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
    if(act==='tccedit'){ openTccModal(); return; }
    if(act==='etnova'){ openEtapaModal(null); return; }
    if(act==='etsugerir'){ criarEtapasSugeridas(); return; }
    if(act==='etedit'){ var et=acharEtapa(id); if(et) openEtapaModal(et); return; }
    if(act==='gkey'){ return; }
    if(act==='etciclo'){ e.stopPropagation(); cicloEtapa(id); return; }
    if(act==='ornova'){ openOrientModal(null); return; }
    if(act==='oredit'){ var or=acharOrient(id); if(or) openOrientModal(or); return; }
    if(act==='crono'){ cronoModo=el.getAttribute('data-m'); saveUI(); renderTcc(); return; }
    if(act==='pedit'){ e.stopPropagation(); e.preventDefault(); abrirEdicaoPaginas(el); return; }
    if(act==='editsubj'){ var mat=findSubject(id)||subjectTcc(); if(mat) openSubjectModal(mat); return; }
    if(act==='tccadd'){
      var alvo=subjectTcc(); if(!alvo) return;
      var antes=currentSubjectId; currentSubjectId=alvo.id; openTextModal(null); currentSubjectId=antes; return; }
    if(act==='edit'){ var t=findText(id); if(t) openTextModal(t); return; }
    if(act==='adiar'){ var ta=findText(id); if(ta && ta.classDate) openAdiarModal(ta); return; }
    if(act==='pill'){ e.stopPropagation();
      menuPorTeclado = (e.detail===0);
      openMenuId=(openMenuId===id?null:id); renderTcc(); renderStatusMenu(); return; }
  }

      sync='<p>Cole um token do GitHub para o progresso viajar entre o computador e o celular sozinho. Sem isso, dá para levar os dados na mão em <b>Cópia de segurança</b>, mais abaixo.</p>'
        +(syncState==='erro'?'<div class="fstat warn">'+svg(IC.alert,14)+' '+esc(syncMsg)+'</div>':'')
        +'<div class="field"><label for="sync_tok">Token do GitHub</label>'
        +'<input id="sync_tok" type="password" placeholder="ghp_…" autocomplete="off"></div>'
        +'<div class="fileacts"><button class="btn-wine" data-syncon>'+svg(IC.sync,15)+' Conectar</button></div>'
        +'<details class="abnt" open><summary>Como criar o token (uma vez só)</summary>'
        +'<ol class="hint2" style="margin:0 0 10px;padding-left:20px">'
        +'<li>No GitHub: foto do perfil → <b>Settings</b>.</li>'
        +'<li>No fim do menu da esquerda: <b>Developer settings</b>.</li>'
        +'<li><b>Personal access tokens</b> → <b>Tokens (classic)</b>.</li>'
        +'<li>Botão <b>Generate new token</b> → <b>Generate new token (classic)</b>.</li>'
        +'<li>Em <b>Note</b> escreva algo como "tracker" e escolha a validade em <b>Expiration</b>.</li>'
        +'<li>Na lista de caixinhas, marque <b>somente</b> <code>gist</code>. Nenhuma outra.</li>'
        +'<li>Role até o fim → <b>Generate token</b> → copie. Começa com <code>ghp_</code> e o GitHub só mostra uma vez.</li></ol>'
        +'<p class="hint2"><b>Precisa ser o clássico.</b> Os <i>Fine-grained tokens</i>, que aparecem primeiro na tela, ainda não oferecem permissão de Gists — lá a opção simplesmente não existe. Marcando só <code>gist</code> no clássico, o token fica igualmente restrito: alcança seus gists e nada mais.</p>'
        +'<p class="hint2">O token fica guardado só neste aparelho e nunca entra no Exportar. Se perder o celular, dá para revogá-lo no GitHub com um clique.</p></details>';
    }

    var html='<div class="modal" role="dialog" aria-modal="true">'
      +'<div class="modal-head"><h2>Salvar e sincronizar</h2><button class="icon-btn" data-x aria-label="Fechar">'+svg(IC.x)+'</button></div>'
      +'<h3 class="fsec">Entre aparelhos</h3>'+sync
      +'<h3 class="fsec">Neste computador</h3>'
      +estado+corpo
      +(acoes?'<div class="fileacts">'+acoes+'</div>':'')
      +'<h3 class="fsec">Cópia de segurança</h3>'
      +'<p class="hint2">Baixa ou carrega um arquivo com tudo: matérias, textos, faltas e progresso. Serve para guardar por fora ou levar para um aparelho que não usa a sincronização.</p>'
      +'<div class="fileacts"><button class="btn-ghost" data-exportar>'+svg(IC.down,15)+' Exportar</button>'
      +'<button class="btn-ghost" data-importar>'+svg(IC.up,15)+' Importar</button></div>'
      +drive
      +'<div class="modal-foot"><button class="btn-ghost" data-cancel>Fechar</button></div></div>';

    var ov=buildOverlay(html);
    ov.querySelector('[data-x]').addEventListener('click', closeModal);
    ov.querySelector('[data-cancel]').addEventListener('click', closeModal);
    var b;
    if((b=ov.querySelector('[data-novo]')))        b.addEventListener('click', function(){ conectarArquivo(true); });
    if((b=ov.querySelector('[data-abrir]')))       b.addEventListener('click', function(){ conectarArquivo(false); });
    if((b=ov.querySelector('[data-reconectar]')))  b.addEventListener('click', reconectarArquivo);
    if((b=ov.querySelector('[data-desconectar]'))) b.addEventListener('click', desconectarArquivo);
    if((b=ov.querySelector('[data-syncon]')))   b.addEventListener('click', function(){
      syncConectar(document.getElementById('sync_tok').value); });
    if((b=ov.querySelector('[data-syncpush]'))) b.addEventListener('click', function(){
      syncEnviar(false).then(function(){ if(syncState==='on'){ closeModal(); renderAll(); } else abrirModalArquivo(); }); });
    if((b=ov.querySelector('[data-syncforce]')))b.addEventListener('click', function(){
      syncEnviar(true).then(function(){ closeModal(); renderAll(); }); });
    if((b=ov.querySelector('[data-syncpull]'))) b.addEventListener('click', function(){ syncBaixar(); });
    if((b=ov.querySelector('[data-exportar]'))) b.addEventListener('click', doExport);
    if((b=ov.querySelector('[data-importar]'))) b.addEventListener('click', function(){ importFile.click(); });
    if((b=ov.querySelector('[data-syncoff]')))  b.addEventListener('click', function(){
      if(!confirm('Desconectar a sincronização deste aparelho?\n\nO progresso continua salvo aqui e a cópia na nuvem não é apagada.')) return;
      esqueceSync(); closeModal(); renderAll(); });
    var tok=ov.querySelector('#sync_tok'); if(tok) tok.focus();
  }

  // ---- export / import ----
  function stamp(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function downloadJson(data, filename){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }
  // mesmo formato do arquivo e do gist — inclui updatedAt, que é o que permite
  // avisar "este arquivo é mais antigo que o que está aberto"
  function doExport(){ downloadJson(payload(), 'tracker-leituras-'+stamp()+'.json'); }
  function doImport(file){
    var reader=new FileReader();
    reader.onload=function(){
      var obj;
      try{ obj=JSON.parse(reader.result); }catch(e){ alert('Não consegui ler esse arquivo. Verifique se é um JSON exportado por este tracker.'); return; }
      if(!obj || !Array.isArray(obj.subjects)){ alert('Esse JSON não parece ser um backup deste tracker (não encontrei matérias).'); return; }
      /* Trocar as matérias mantendo os textos antigos deixaria todos eles órfãos:
         apontando para matérias que não existem mais, invisíveis na lista e
         somados no topo da página. Um backup de verdade sempre traz a chave. */
      if(!temChave(obj,'texts')){
        alert('Este arquivo tem as matérias mas não a lista de textos.\n\nNão parece um backup completo deste tracker, então nada foi alterado.');
        return; }
      var levaTcc = Object.prototype.hasOwnProperty.call(obj,'tcc');
      if(!confirm('Importar vai SUBSTITUIR as matérias e os textos atuais'
        +(levaTcc?', e também tudo da aba TCC (etapas, orientações, prazo)':'')
        +'.\n\nO que está aqui agora: '+subjects.length+' matéria(s) e '+texts.length+' texto(s).'
        +'\nO que vem do arquivo: '+obj.subjects.length+' matéria(s) e '+obj.texts.length+' texto(s).'
        +'\n\nUm backup do estado atual será baixado antes. Continuar?')) return;
      downloadJson(payload(), 'backup-antes-de-importar-'+stamp()+'.json');
      var d=normalizarTudo(obj.subjects, temChave(obj,'texts')?obj.texts:texts);
      subjects=d.subjects; texts=d.texts;
      tcc=tccRecebido(obj, tcc);
      currentSubjectId=null; ajustarMateriaAtual();
      query=''; fTag=''; searchInput.value=''; clearX.style.display='none';
      closeModal();
      persist(); renderAll();
      alert('Importado: '+subjects.length+' matéria(s) e '+texts.length+' texto(s).');
    };
    reader.readAsText(file);
  }

  function clearSearch(){
    if(searchTimer){ clearTimeout(searchTimer); searchTimer=null; }
    // o X limpa a BUSCA; o filtro "falta ler" tem botão próprio e fica onde está
    query=''; fTag=''; searchInput.value=''; clearX.style.display='none';
    renderTagbar(); renderTable();
  }

  // ---- mount ----
  function mount(){
    app=document.getElementById('app');
    app.innerHTML=
      '<header class="hero" id="hero"></header>'
      +'<div class="viewbar">'
        +'<div class="vswitch" id="vswitch">'
          +'<button data-v="subject" aria-pressed="false">'+svg(IC.list,15)+' Por matéria</button>'
          +'<button data-v="week" aria-pressed="false">'+svg(IC.cal,15)+' Cronograma</button>'
          +'<span class="vsep" aria-hidden="true"></span>'
          +'<button class="tcc-tab" data-v="tcc" aria-pressed="false">'+svg(IC.book,15)+' TCC</button>'
        +'</div>'
        +'<div class="viewbar-right">'
          +'<button class="btn-ghost sm" id="fileBtn"></button>'
          +'<span id="avisos" class="sr-only" role="status" aria-live="polite"></span>'
          +'<button class="icon-toggle" id="prefsBtn" title="Menu e preferências">'+svg(IC.menu,17)+'</button>'
          +'<button class="icon-toggle" id="theme" title="Modo escuro"></button></div>'
      +'</div>'
      +'<div class="subjects" id="subjects"></div>'
      +'<section class="panel" id="panel"></section>'
      +'<div class="toolbar" id="toolbar">'
        +'<div class="search" id="searchWrap"><span style="display:inline-flex;opacity:.5">'+svg(IC.search,15)+'</span>'
          +'<label for="q" class="sr-only">Buscar texto nesta matéria</label>'
          +'<input id="q" placeholder="Buscar texto nesta matéria…">'
          +'<button class="clear-x" id="clearx" aria-label="Limpar busca" style="display:none">'+svg(IC.x,13)+'</button></div>'
        +'<div class="sort-mob" id="sortMob"><label for="sortSel">Ordenar:</label> <select class="tool-select" id="sortSel">'
          +'<option value="number">Nº</option><option value="date">Data da aula</option>'
          +'<option value="author">Autor</option><option value="status">Status</option>'
          +'<option value="priority">Prioridade</option></select>'
          +'<button class="icon-toggle sortdir" id="sortDirBtn" type="button"></button></div>'
        +'<div class="tool-right">'
          +'<button class="btn-ghost sm" id="pend" aria-pressed="false">'+svg(IC.check,14)+' Falta ler</button>'
          +'<button class="btn-wine" id="add">'+svg(IC.plus,15)+' Adicionar</button>'
        +'</div>'
        +'<input type="file" id="impfile" accept="application/json,.json" style="display:none">'
      +'</div>'
      +'<div class="tagbar" id="tagbar"></div>'
      +'<div class="table-wrap" id="tw"></div>'
      +'<div class="week" id="week"></div>'
      +'<div class="tcc" id="tcc"></div>'
      +'<footer class="foot" id="foot"></footer>';

    hero=document.getElementById('hero');
    subjectsEl=document.getElementById('subjects');
    panel=document.getElementById('panel');
    toolbar=document.getElementById('toolbar');
    tagbar=document.getElementById('tagbar');
    tw=document.getElementById('tw');
    weekEl=document.getElementById('week');
    tccEl=document.getElementById('tcc');
    tccEl.addEventListener('click', tccActions);
    tccEl.addEventListener('keydown', function(e){
      if(e.key!=='Enter' && e.key!==' ') return;
      var alvo=e.target.closest('.gcell-l[data-act]'); if(!alvo) return;
      e.preventDefault(); alvo.click();
    });
    foot=document.getElementById('foot');
    searchInput=document.getElementById('q');
    clearX=document.getElementById('clearx');
    importFile=document.getElementById('impfile');
    themeBtn=document.getElementById('theme');

    searchInput.addEventListener('input', function(){
      query=searchInput.value; clearX.style.display=query?'':'none';
      if(searchTimer) clearTimeout(searchTimer);
      searchTimer=setTimeout(function(){ searchTimer=null; renderTable(); }, 120);
    });
    clearX.addEventListener('click', clearSearch);
    document.getElementById('sortSel').addEventListener('change', function(){
      sortKey=this.value; sortDir='asc'; saveUI(); renderSortDir(); renderTable();
    });
    /* no celular não existe cabeçalho de tabela para clicar: sem este botão a
       ordem invertida só podia ser escolhida no PC, e voltava sozinha para
       crescente assim que se trocava o critério. */
    document.getElementById('sortDirBtn').addEventListener('click', function(){
      sortDir = (sortDir==='asc'?'desc':'asc'); saveUI(); renderSortDir(); renderTable();
      anunciar(sortDir==='asc'?'Ordem crescente':'Ordem decrescente');
    });
    themeBtn.addEventListener('click', function(){ dark=!dark; saveUI(); renderAll(); });
    document.getElementById('vswitch').addEventListener('click', function(e){
      var b=e.target.closest('[data-v]'); if(!b) return;
      view=b.getAttribute('data-v'); openMenuId=null;
      saveUI(); applyView(); renderMain();
    });
    document.getElementById('pend').addEventListener('click', function(){
      soPendentes=!soPendentes; saveUI(); renderPendBtn(); renderTagbar(); renderTable();
      anunciar(soPendentes?'Mostrando só o que falta ler':'Mostrando tudo');
    });
    document.getElementById('add').addEventListener('click', novoTexto);
    document.getElementById('fileBtn').addEventListener('click', abrirModalArquivo);
    document.getElementById('prefsBtn').addEventListener('click', abrirPreferencias);
    importFile.addEventListener('change', function(){ if(importFile.files && importFile.files[0]){ doImport(importFile.files[0]); importFile.value=''; } });

    subjectsEl.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act');
      if(act==='pick'){ currentSubjectId=el.getAttribute('data-id'); query=''; fTag=''; faltasAberta=false;
        searchInput.value=''; clearX.style.display='none'; openMenuId=null; renderAll(); return; }
      if(act==='addsubj'){ openSubjectModal(null); return; }
    });

    panel.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
      if(act==='editsubj'){ var s=findSubject(id); if(s) openSubjectModal(s); return; }
      if(act==='togglefaltas'){ faltasAberta=!faltasAberta; renderPanel(); return; }
      if(act==='addfalta'){
        var card=el.closest('.subj-head');
        var inp=card?card.querySelector('[data-fdate]'):null;
        addFalta(el.getAttribute('data-sid'), inp?inp.value:'');
        return;
      }
      if(act==='delfalta'){ delFalta(el.getAttribute('data-sid'), el.getAttribute('data-d')); return; }
    });

    tagbar.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act');
      if(act==='tagf'){ var t=el.getAttribute('data-t'); fTag=(fTag===t?'':t); renderTagbar(); renderTable(); return; }
      if(act==='tagclear'){ fTag=''; renderTagbar(); renderTable(); return; }
    });

    /* Troca o número por um campo ali mesmo, sem re-renderizar a lista —
       re-renderizar mataria o foco no meio da digitação. */
    function rowActions(e){
      if(e.target.closest('[data-stop]')) return;
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
      if(act==='sort'){ var k=el.getAttribute('data-k');
        if(sortKey===k) sortDir=(sortDir==='asc'?'desc':'asc'); else { sortKey=k; sortDir='asc'; }
        var sel=document.getElementById('sortSel'); if(sel) sel.value=sortKey;
        renderSortDir();
        openMenuId=null; renderTable(); return; }
      if(act==='clearsearch'){ soPendentes=false; saveUI(); renderPendBtn(); clearSearch(); return; }
      if(act==='verpend'){ soPendentes=false; saveUI(); renderPendBtn(); renderTable(); return; }
      if(act==='pedit'){ e.stopPropagation(); e.preventDefault(); abrirEdicaoPaginas(el); return; }
      if(act==='tagf'){ e.stopPropagation(); var g=el.getAttribute('data-t'); fTag=(fTag===g?'':g); renderTagbar(); renderTable(); return; }
      if(act==='edit'){ var t=findText(id); if(t) openTextModal(t); return; }
      if(act==='adiar'){ e.stopPropagation(); var ta=findText(id); if(ta && ta.classDate) openAdiarModal(ta); return; }
      if(act==='abrircard'){ var tc=findText(id); if(tc) openTextModal(tc); return; }
      if(act==='pill'){ e.stopPropagation();
        menuPorTeclado = (e.detail===0);          // clique sintético do Enter/Espaço
        openMenuId=(openMenuId===id?null:id); renderMain(); return; }
      if(act==='setstatus'){ e.stopPropagation(); var b=findText(id); if(b) b.status=el.getAttribute('data-s');
        openMenuId=null; persist(); renderAll(); return; }
    }
    tw.addEventListener('click', rowActions);
    weekEl.addEventListener('click', rowActions);

    document.addEventListener('click', function(){
      var changed=false;
      if(openMenuId!==null){ openMenuId=null; changed=true; }
      if(changed) renderMain();
    });

    document.addEventListener('keydown', function(e){
      if(e.key==='Escape'){
        if(modalOpen()){ closeModal(); return; }
        var changed=false;
        if(openMenuId!==null){ openMenuId=null; changed=true; }
        if(changed) renderMain();
        return;
      }
      if(modalOpen()) return;
      var tag=(e.target && e.target.tagName)||'';
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
      if(e.ctrlKey||e.metaKey||e.altKey) return;
      if(e.key==='n'){ e.preventDefault();
        if(view==='tcc'){ openEtapaModal(null); return; }
        novoTexto(); return; }
      // "t" abre e fecha o TCC — ele fica fora do rodízio da tecla "s"
      if(e.key==='t'){ e.preventDefault();
        openMenuId=null;
        view = (view==='tcc') ? 'subject' : 'tcc';
        saveUI(); applyView(); renderMain(); return; }
      if(e.key==='/'){ e.preventDefault(); if(view!=='subject'){ view='subject'; applyView(); renderMain(); } searchInput.focus(); return; }
      if(e.key==='s'){ e.preventDefault();
        openMenuId=null;
        var ordem=['subject','week'];
        var i=ordem.indexOf(view);
        view = (i<0) ? 'subject' : ordem[(i+1)%ordem.length];
        saveUI(); applyView(); renderMain(); return; }
    });

    /* Trocar innerHTML muda a altura da página e o navegador dispara um
       "scroll" que NÃO veio da pessoa. Fechar o menu nesse evento fazia ele
       nunca abrir. Só fecha se a página realmente se moveu. */
    window.addEventListener('scroll', function(){
      if(openMenuId===null) return;
      if(Math.abs(window.pageYOffset-menuScroll.y)<2 && Math.abs(window.pageXOffset-menuScroll.x)<2) return;
      openMenuId=null; renderStatusMenu();
    }, true);
    window.addEventListener('resize', function(){
      if(openMenuId!==null){ openMenuId=null; renderStatusMenu(); }
      if(isNarrow()!==narrow){ narrow=isNarrow(); applyView(); renderMain(); }
    });

    // Só preferências de tela: os dados já são salvos a cada alteração.
    window.addEventListener('beforeunload', function(){ try{ saveUI(); }catch(e){} });
    /* pagehide cobre o celular (fechar o app, trocar de aba), onde beforeunload
       muitas vezes nem dispara. */
    window.addEventListener('pagehide', function(){ try{ saveUI(); descarregarPendencias(); }catch(e){} });
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='hidden'){ try{ saveUI(); descarregarPendencias(); }catch(e){} }
    });

    narrow=isNarrow();
    load();
    migrarFaltas();
    loadUI();
    migrarTcc();
    loadSync();
    retomarArquivo();
    ajustarMateriaAtual();
    searchInput.value=query;
    renderAll();
    syncAoAbrir();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
</body>
</html>
